<script>

const SC_IP_API =
"https://script.google.com/macros/s/AKfycbzrDLNOj56LEjyLuf4PJiBsH5s36RgRi6y55NjjVJtxvRjFPUMdcXLsOK4ojNUssdNX/exec";


let scIpData = [];

let scIpCategory =
  "All";


async function scIpLoad(){

  try{

    const response =
      await fetch(
        SC_IP_API +
        "?action=places"
      );


    const result =
      await response.json();


    if(
      !result ||
      !result.success ||
      !Array.isArray(
        result.data
      )
    ){

      throw new Error(
        "Places data unavailable"
      );

    }


    scIpData =
      result.data;


    scIpCreateCategories();

    scIpRender();

  }

  catch(error){

    console.error(
      "Important Places:",
      error
    );


    document.getElementById(
      "scIpGrid"
    ).innerHTML = `

      <div class="sc-ip-empty">

        Unable to load important places.

      </div>

    `;


    document.getElementById(
      "scIpCount"
    ).textContent =
      "Unable to load data.";

  }

}


function scIpCreateCategories(){

  const holder =
    document.getElementById(
      "scIpCategories"
    );


  const categories = [

    "All",

    ...new Set(

      scIpData

        .map(function(item){

          return (

            item.Category ||

            item["Place Type"] ||

            item.Type ||

            ""

          );

        })

        .filter(Boolean)

    )

  ];


  holder.innerHTML =
    "";


  categories.forEach(
    function(category){

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.textContent =
        category;


      if(
        category === "All"
      ){

        button.classList.add(
          "active"
        );

      }


      button.addEventListener(
        "click",
        function(){

          scIpSelectCategory(
            button,
            category
          );

        }
      );


      holder.appendChild(
        button
      );

    }
  );

}


function scIpSelectCategory(
  button,
  category
){

  document

    .querySelectorAll(
      "#scIpCategories button"
    )

    .forEach(function(btn){

      btn.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );


  scIpCategory =
    category;


  scIpRender();

}


function scIpRender(){

  const grid =
    document.getElementById(
      "scIpGrid"
    );


  const count =
    document.getElementById(
      "scIpCount"
    );


  const search =
    document

      .getElementById(
        "scIpSearch"
      )

      .value

      .trim()

      .toLowerCase();


  const filtered =
    scIpData.filter(
      function(item){

        const category =
          String(

            item.Category ||

            item["Place Type"] ||

            item.Type ||

            ""

          );


        const text =
          Object.values(item)

            .join(" ")

            .toLowerCase();


        return (

          (
            scIpCategory ===
              "All"

            ||

            category ===
              scIpCategory
          )

          &&

          (
            !search

            ||

            text.includes(
              search
            )
          )

        );

      }
    );


  count.textContent =

    filtered.length +

    (
      filtered.length === 1
        ? " place found"
        : " places found"
    );


  if(
    !filtered.length
  ){

    grid.innerHTML = `

      <div class="sc-ip-empty">

        No matching place found.

      </div>

    `;

    return;

  }


  grid.innerHTML =
    "";


  filtered.forEach(
    function(item){

      grid.appendChild(
        scIpCreateCard(
          item
        )
      );

    }
  );

}


function scIpCreateCard(item){

  const name =

    item["Place Name"] ||

    item.Name ||

    item.Title ||

    "Important Place";


  const type =

    item.Category ||

    item["Place Type"] ||

    item.Type ||

    "Place";


  const location =

    item.Location ||

    item.Address ||

    "";


  const description =

    item.Description ||

    item.Details ||

    "";


  const image =

    item["Image URL"] ||

    item.imageUrl ||

    item.Image ||

    item["Photo URL"] ||

    item.Photo ||

    "";


  const savedMap =

    item["Google Map Link"] ||

    item["Google Maps Link"] ||

    item["Google Map URL"] ||

    item["Google Maps URL"] ||

    item["Map Link"] ||

    item["Map URL"] ||

    item["Location URL"] ||

    item["Directions URL"] ||

    item.mapUrl ||

    item.Map ||

    item.GoogleMaps ||

    "";


  let directionsUrl = "";


  if(
    scIpValidUrl(
      savedMap
    )
  ){

    directionsUrl =
      savedMap;

  }

  else{

    const searchText =

      name +

      (
        location
          ? ", " + location
          : ", Sursand, Bihar"
      );


    directionsUrl =

      "https://www.google.com/maps/search/?api=1&query=" +

      encodeURIComponent(
        searchText
      );

  }


  const article =
    document.createElement(
      "article"
    );


  article.className =
    "sc-ip-card";


  const imageWrap =
    document.createElement(
      "div"
    );


  imageWrap.className =
    "sc-ip-image-wrap";


  if(
    scIpValidUrl(
      image
    )
  ){

    const img =
      document.createElement(
        "img"
      );


    img.className =
      "sc-ip-image";


    img.src =
      image;


    img.alt =
      name;


    img.loading =
      "lazy";


    img.onerror =
      function(){

        imageWrap.innerHTML =

          '<div class="sc-ip-image-placeholder">' +

          scIpIcon(type) +

          '</div>';

      };


    imageWrap.appendChild(
      img
    );

  }

  else{

    imageWrap.innerHTML =

      '<div class="sc-ip-image-placeholder">' +

      scIpIcon(type) +

      '</div>';

  }


  article.appendChild(
    imageWrap
  );


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "sc-ip-body";


  const icon =
    document.createElement(
      "div"
    );


  icon.className =
    "sc-ip-icon";


  icon.textContent =
    scIpIcon(
      type
    );


  body.appendChild(
    icon
  );


  const typeElement =
    document.createElement(
      "span"
    );


  typeElement.className =
    "sc-ip-type";


  typeElement.textContent =
    type;


  body.appendChild(
    typeElement
  );


  const title =
    document.createElement(
      "h3"
    );


  title.textContent =
    name;


  body.appendChild(
    title
  );


  if(
    location
  ){

    const locationElement =
      document.createElement(
        "div"
      );


    locationElement.className =
      "sc-ip-location";


    locationElement.textContent =
      "📍 " + location;


    body.appendChild(
      locationElement
    );

  }


  const actions =
    document.createElement(
      "div"
    );


  actions.className =
    "sc-ip-actions";


  const more =
    document.createElement(
      "button"
    );


  more.type =
    "button";


  more.className =
    "sc-ip-more";


  more.innerHTML =
    "ⓘ Know More";


  more.addEventListener(
    "click",
    function(){

      scIpOpenModal({

        name:name,

        type:type,

        location:location,

        description:description,

        image:image,

        directionsUrl:
          directionsUrl

      });

    }
  );


  actions.appendChild(
    more
  );


  const direction =
    document.createElement(
      "a"
    );


  direction.className =
    "sc-ip-direction";


  direction.href =
    directionsUrl;


  direction.target =
    "_blank";


  direction.rel =
    "noopener noreferrer";


  direction.innerHTML =
    "🧭 Get Directions";


  actions.appendChild(
    direction
  );


  body.appendChild(
    actions
  );


  article.appendChild(
    body
  );


  return article;

}


function scIpOpenModal(place){

  const modal =
    document.getElementById(
      "scIpModal"
    );


  const image =
    document.getElementById(
      "scIpModalImage"
    );


  document.getElementById(
    "scIpModalType"
  ).textContent =

    scIpIcon(
      place.type
    )

    + " " +

    place.type;


  document.getElementById(
    "scIpModalTitle"
  ).textContent =
    place.name;


  document.getElementById(
    "scIpModalLocation"
  ).textContent =

    place.location
      ? "📍 " + place.location
      : "📍 Sursand";


  document.getElementById(
    "scIpModalDescription"
  ).textContent =

    place.description

    ||

    "Detailed information about this place will be added soon.";


  if(
    scIpValidUrl(
      place.image
    )
  ){

    image.src =
      place.image;


    image.alt =
      place.name;


    image.style.display =
      "block";

  }

  else{

    image.removeAttribute(
      "src"
    );


    image.style.display =
      "none";

  }


  const actions =
    document.getElementById(
      "scIpModalActions"
    );


  actions.innerHTML =
    "";


  const direction =
    document.createElement(
      "a"
    );


  direction.href =
    place.directionsUrl;


  direction.target =
    "_blank";


  direction.rel =
    "noopener noreferrer";


  direction.innerHTML =
    "🧭 Get Directions";


  actions.appendChild(
    direction
  );


  modal.classList.add(
    "active"
  );


  document.body.style.overflow =
    "hidden";

}


function scIpCloseModal(){

  document

    .getElementById(
      "scIpModal"
    )

    .classList.remove(
      "active"
    );


  document.body.style.overflow =
    "";

}


document

  .getElementById(
    "scIpModal"
  )

  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        scIpCloseModal();

      }

    }
  );


document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Escape"
    ){

      scIpCloseModal();

    }

  }
);


function scIpIcon(type){

  const t =
    String(
      type || ""
    )
    .toLowerCase();


  if(
    t.includes("hospital") ||
    t.includes("health")
  ){
    return "🏥";
  }


  if(
    t.includes("school")
  ){
    return "🏫";
  }


  if(
    t.includes("college")
  ){
    return "🎓";
  }


  if(
    t.includes("police")
  ){
    return "👮";
  }


  if(
    t.includes("bank")
  ){
    return "🏦";
  }


  if(
    t.includes("temple")
  ){
    return "🛕";
  }


  if(
    t.includes("mosque")
  ){
    return "🕌";
  }


  if(
    t.includes("market")
  ){
    return "🛒";
  }


  if(
    t.includes("office")
  ){
    return "🏢";
  }


  if(
    t.includes("station") ||
    t.includes("bus")
  ){
    return "🚌";
  }


  if(
    t.includes("park")
  ){
    return "🌳";
  }


  if(
    t.includes("religious")
  ){
    return "🙏";
  }


  return "📍";

}


function scIpValidUrl(value){

  const url =
    String(
      value || ""
    )
    .trim();


  return (

    url.startsWith(
      "https://"
    )

    ||

    url.startsWith(
      "http://"
    )

  );

}


if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    scIpLoad
  );

}

else{

  scIpLoad();

}

</script>
