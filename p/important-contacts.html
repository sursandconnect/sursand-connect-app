<section class="sc-ic-hero">

  <h1>
    ☎️ Important Contacts
  </h1>

  <p>
    Find useful local, public-service and emergency
    contact information for Sursand in one place.
  </p>

      id="scIcSearch"
      type="search"
      placeholder="Search department, service, office or contact..."
      oninput="scIcRender()">

      onclick="scIcRender()">

<div
  class="sc-ic-filter"
  id="scIcCategories">
</div>


<div
  class="sc-ic-count"
  id="scIcCount">

  Loading important contacts...

</div>


<!-- =========================================================
     GRID
     ========================================================= -->

<div
  class="sc-ic-grid"
  id="scIcGrid">

  <div class="sc-ic-empty">

    Loading important contacts...

  </div>

</div>


<script>

/* =========================================================
   API
   ========================================================= */

const SC_IC_API =
"https://script.google.com/macros/s/AKfycbzrDLNOj56LEjyLuf4PJiBsH5s36RgRi6y55NjjVJtxvRjFPUMdcXLsOK4ojNUssdNX/exec";


let scIcData = [];

let scIcCategory =
  "All";


/* =========================================================
   LOAD
   ========================================================= */

async function scIcLoad(){

  try{

    const response =
      await fetch(
        SC_IC_API +
        "?action=contacts"
      );


    const result =
      await response.json();


    if(
      !result ||
      !result.success ||
      !Array.isArray(
        result.data
      )
    ){

      throw new Error(
        "Important contact data unavailable"
      );

    }


    scIcData =
      result.data;


    scIcCreateCategories();

    scIcRender();

  }

  catch(error){

    console.error(
      "Important Contacts:",
      error
    );


    document.getElementById(
      "scIcGrid"
    ).innerHTML = `

      <div class="sc-ic-empty">

        Unable to load important contacts.

      </div>

    `;


    document.getElementById(
      "scIcCount"
    ).textContent =
      "Unable to load data.";

  }

}


/* =========================================================
   CATEGORIES
   ========================================================= */

function scIcCreateCategories(){

  const holder =
    document.getElementById(
      "scIcCategories"
    );


  const categories = [

    "All",

    ...new Set(

      scIcData

      .map(
        function(item){

          return (

            item.Category ||

            item.category ||

            item[
              "Contact Type"
            ] ||

            item.Type ||

            ""

          );

        }
      )

      .filter(Boolean)

    )

  ];


  holder.innerHTML =
    "";


  categories.forEach(
    function(category){

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.textContent =
        category;


      if(
        category === "All"
      ){

        button.classList.add(
          "active"
        );

      }


      button.onclick =
        function(){

          holder
          .querySelectorAll(
            "button"
          )
          .forEach(
            function(btn){

              btn.classList.remove(
                "active"
              );

            }
          );


          button.classList.add(
            "active"
          );


          scIcCategory =
            category;


          scIcRender();

        };


      holder.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   RENDER
   ========================================================= */

function scIcRender(){

  const grid =
    document.getElementById(
      "scIcGrid"
    );


  const search =
    document
    .getElementById(
      "scIcSearch"
    )
    .value
    .trim()
    .toLowerCase();


  const filtered =
    scIcData.filter(
      function(item){

        const category =
          String(

            item.Category ||

            item.category ||

            item[
              "Contact Type"
            ] ||

            item.Type ||

            ""

          );


        const searchable =
          Object.values(item)
          .join(" ")
          .toLowerCase();


        return (

          (
            scIcCategory === "All"

            ||

            category === scIcCategory
          )

          &&

          (
            !search

            ||

            searchable.includes(
              search
            )
          )

        );

      }
    );


  document.getElementById(
    "scIcCount"
  ).textContent =

    filtered.length +

    (
      filtered.length === 1
        ? " contact found"
        : " contacts found"
    );


  if(
    !filtered.length
  ){

    grid.innerHTML = `

      <div class="sc-ic-empty">

        No matching contact found.

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered.map(
      function(item){

        const name =

          item[
            "Contact Name"
          ] ||

          item[
            "Office Name"
          ] ||

          item[
            "Service Name"
          ] ||

          item.Name ||

          item.Title ||

          "Important Contact";


        const category =

          item.Category ||

          item.category ||

          item[
            "Contact Type"
          ] ||

          item.Type ||

          "Important Contact";


        const department =

          item.Department ||

          item[
            "Department Name"
          ] ||

          "";


        const phone =

          item.Phone ||

          item.Mobile ||

          item[
            "Contact Number"
          ] ||

          item.Helpline ||

          "";


        const alternate =

          item[
            "Alternate Number"
          ] ||

          item[
            "Alternative Number"
          ] ||

          "";


        const whatsapp =

          item.WhatsApp ||

          item[
            "WhatsApp Number"
          ] ||

          item[
            "Whatsapp Number"
          ] ||

          phone ||

          "";


        const address =

          item.Address ||

          item.Location ||

          item.Area ||

          "";


        const description =

          item.Description ||

          item.Details ||

          "";


        const map =

          item[
            "Google Map Link"
          ] ||

          item[
            "Google Maps Link"
          ] ||

          item[
            "Map URL"
          ] ||

          item.Map ||

          "";


        const website =

          item.Website ||

          item.URL ||

          item[
            "Official Website"
          ] ||

          "";


        const isEmergency =
          String(category)
          .toLowerCase()
          .includes(
            "emergency"
          );


        const whatsappNumber =
          scIcWhatsApp(
            whatsapp
          );


        const mapUrl =
          scIcMapUrl(
            name,
            address,
            map
          );


        let actions = "";


        /* =================================================
           CALL — ALWAYS VISIBLE
           ================================================= */

        if(phone){

          actions += `

            <a
              class="sc-ic-call"
              href="tel:${scIcPhone(phone)}">

              📞 Call

            </a>

          `;

        }

        else{

          actions += `

            <button
              type="button"
              class="sc-ic-call"
              onclick="scIcPhoneUnavailable()">

              📞 Call

            </button>

          `;

        }


        /* =================================================
           WHATSAPP — ALWAYS VISIBLE
           ================================================= */

        if(whatsappNumber){

          actions += `

            <a
              class="sc-ic-whatsapp"
              href="https://wa.me/${whatsappNumber}?text=${encodeURIComponent(
                "Hello, I found your contact through Sursand Connect."
              )}"
              target="_blank"
              rel="noopener noreferrer">

              💬 WhatsApp

            </a>

          `;

        }

        else{

          actions += `

            <button
              type="button"
              class="sc-ic-whatsapp"
              onclick="scIcWhatsAppUnavailable()">

              💬 WhatsApp

            </button>

          `;

        }


        /* WEBSITE */

        if(
          scIcValidUrl(
            website
          )
        ){

          actions += `

            <a
              class="sc-ic-web"
              href="${scIcUrl(website)}"
              target="_blank"
              rel="noopener noreferrer">

              🌐 Website

            </a>

          `;

        }


        /* DIRECTIONS */

        if(
          map ||
          address
        ){

          actions += `

            <a
              class="sc-ic-map"
              href="${scIcUrl(mapUrl)}"
              target="_blank"
              rel="noopener noreferrer">

              🧭 Directions

            </a>

          `;

        }


        const actionCount =
          (
            actions.match(
              /class="sc-ic-/g
            ) || []
          ).length;


        return `

          <article
            class="sc-ic-card ${
              isEmergency
              ? "emergency"
              : ""
            }">


            <div class="sc-ic-icon">

              ${scIcIcon(category)}

            </div>


            <span class="sc-ic-type">

              ${scIcEsc(category)}

            </span>


            <h3>

              ${scIcEsc(name)}

            </h3>


            <div class="sc-ic-info">


              ${
                department

                ? `

                  <div class="sc-ic-row">

                    🏢

                    <strong>
                      Department:
                    </strong>

                    ${scIcEsc(department)}

                  </div>

                `

                : ""
              }


              ${
                phone

                ? `

                  <div class="sc-ic-row">

                    ☎️

                    <strong>
                      Phone:
                    </strong>

                    ${scIcEsc(phone)}

                  </div>

                `

                : ""
              }


              ${
                alternate

                ? `

                  <div class="sc-ic-row">

                    ☎️

                    <strong>
                      Alternate:
                    </strong>

                    ${scIcEsc(alternate)}

                  </div>

                `

                : ""
              }


              ${
                address

                ? `

                  <div class="sc-ic-row">

                    📍

                    <strong>
                      Address:
                    </strong>

                    ${scIcEsc(address)}

                  </div>

                `

                : ""
              }


              ${
                description

                ? `

                  <div class="sc-ic-row">

                    📝
                    ${scIcEsc(description)}

                  </div>

                `

                : ""
              }


            </div>


            <div
              class="sc-ic-actions ${
                actionCount === 3
                ? "three-actions"
                : ""
              }">

              ${actions}

            </div>


          </article>

        `;

      }
    )
    .join("");

}


/* =========================================================
   MAP
   ========================================================= */

function scIcMapUrl(
  name,
  address,
  map
){

  if(
    scIcValidUrl(
      map
    )
  ){

    return map;

  }


  return (

    "https://www.google.com/maps/search/?api=1&query=" +

    encodeURIComponent(

      name +

      (
        address
        ? ", " + address
        : ", Sursand, Bihar"
      )

    )

  );

}


/* =========================================================
   PHONE
   ========================================================= */

function scIcPhone(value){

  return String(
    value || ""
  )
  .replace(
    /[^0-9+]/g,
    ""
  );

}


/* =========================================================
   WHATSAPP
   ========================================================= */

function scIcWhatsApp(value){

  let number =
    String(
      value || ""
    )
    .replace(
      /\D/g,
      ""
    );


  if(
    number.length === 10
  ){

    number =
      "91" +
      number;

  }


  return number;

}


/* =========================================================
   FALLBACKS
   ========================================================= */

function scIcPhoneUnavailable(){

  alert(
    "Contact number is currently unavailable."
  );

}


function scIcWhatsAppUnavailable(){

  alert(
    "WhatsApp number is currently unavailable."
  );

}


/* =========================================================
   VALID URL
   ========================================================= */

function scIcValidUrl(value){

  const url =
    String(
      value || ""
    )
    .trim();


  return (

    url.startsWith(
      "https://"
    )

    ||

    url.startsWith(
      "http://"
    )

  );

}


/* =========================================================
   URL
   ========================================================= */

function scIcUrl(value){

  return scIcEsc(
    String(
      value || ""
    ).trim()
  );

}


/* =========================================================
   ICON
   ========================================================= */

function scIcIcon(category){

  const value =
    String(
      category || ""
    )
    .toLowerCase();


  if(value.includes("emergency"))
    return "🚨";

  if(value.includes("police"))
    return "👮";

  if(value.includes("hospital"))
    return "🏥";

  if(value.includes("ambulance"))
    return "🚑";

  if(value.includes("fire"))
    return "🚒";

  if(value.includes("electric"))
    return "⚡";

  if(value.includes("water"))
    return "💧";

  if(value.includes("municip"))
    return "🏙️";

  if(value.includes("government"))
    return "🏛️";

  return "☎️";

}


/* =========================================================
   ESCAPE
   ========================================================= */

function scIcEsc(value){

  return String(
    value == null
      ? ""
      : value
  )

  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================================
   START
   ========================================================= */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    scIcLoad
  );

}

else{

  scIcLoad();

}
