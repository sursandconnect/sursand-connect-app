<html><head>

<style>
*{box-sizing:border-box}html,body{margin:0;background:#f8fafc;color:#263238;font-family:Arial,sans-serif}body{padding-top:66px;padding-bottom:82px}
.bar{position:fixed;top:0;left:0;right:0;height:58px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:4px 12px;z-index:99;border-bottom:1px solid #eceff1;box-shadow:0 5px 18px rgba(15,23,42,.08)}
.brand{display:flex;gap:9px;align-items:center;text-decoration:none;color:#263238}.brand img{width:41px;height:41px;border-radius:12px;object-fit:contain}.brand span{display:flex;flex-direction:column}.brand b{font-size:14px}.brand small{font-size:9px;color:#667085}
.back{width:40px;height:40px;border-radius:14px;border:1px solid #f2d1ac;background:#fff0dd;color:#c86508;font-size:20px}
.wrap{max-width:920px;margin:13px auto;padding:0 13px 35px}
.hero{background:linear-gradient(135deg,#ff9d42,#f28c28,#e8740e);color:#fff;border-radius:20px;padding:21px 17px;box-shadow:0 12px 28px rgba(242,140,40,.18)}.hero h1{margin:0 0 5px;font-size:23px}.hero p{margin:0;font-size:10px;line-height:1.55}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:18px 0}.choice button{min-height:120px;border:2px solid #fff;border-radius:20px;color:#fff;font-size:15px;font-weight:900;padding:14px;box-shadow:0 9px 0 rgba(15,23,42,.08),0 17px 25px rgba(15,23,42,.10)}.businessChoice{background:linear-gradient(145deg,#4fb7f3,#2563eb)}.serviceChoice{background:linear-gradient(145deg,#34a853,#238b45)}.choice small{display:block;font-size:9px;font-weight:600;margin-top:7px;opacity:.92}
.formcard{display:none;background:#fff;border:1px solid #e6ebe7;border-radius:18px;padding:14px;margin-top:16px;box-shadow:0 8px 22px rgba(15,23,42,.07)}.formcard.open{display:block}.formhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.formhead h2{margin:0;font-size:16px}.change{border:0;border-radius:9px;padding:7px 9px;background:#fff0dd;color:#b45309;font-size:8px;font-weight:900}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:9px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe5e1;border-radius:10px;padding:10px;background:#fff;color:#263238;font:inherit;font-size:10px}.field textarea{min-height:74px;resize:vertical}.submit{grid-column:1/-1;border:0;border-radius:11px;padding:12px;background:linear-gradient(145deg,#34a853,#238b45);color:#fff;font-size:10px;font-weight:900}.status{grid-column:1/-1;font-size:9px;line-height:1.45;min-height:14px}.status.ok{color:#176b35}.status.err{color:#b91c1c}
.bottom{position:fixed;bottom:0;left:0;right:0;height:64px;background:linear-gradient(135deg,#34a853,#238b45 52%,#176b35);display:grid;grid-template-columns:repeat(5,1fr);z-index:99}.bottom a{color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px}.bottom span{font-size:8px;font-weight:800}
@media(max-width:600px){.formgrid{grid-template-columns:1fr}.field.full,.submit{grid-column:1}.choice{grid-template-columns:1fr}}
</style><script src="../app-ui.js"></script><script src="../app-data-cache.js"></script><script src="../app-full-hi.js"></script></head><body>
<header class="bar"><a class="brand" href="../"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgM6ePTCVaqvhVtE9SqPzEyzrYrHjo0MlxUbzHS1D8ORCNX_at01YJcY6a7ltTxA2AaYEuojBw-VotVudZXLNUHVSs6xQvLX6zbNBh-bVnm0v6gURU0yStk_fObHB9rGNwbkf2v_GTyAmcwAG0m8srp0at1riLJSCvOLU3kFneNoNlX-C1XLbioi4RtmDfU/s1600/IMG_20260820_101456.png"><span><b>Sursand Connect</b><small>Add Business / Service</small></span></a><button class="back" onclick="history.length>1?history.back():location.href='../'">‹</button></header>
<main class="wrap">
<section class="hero"><h1>Add Business / Service</h1><p>Choose what you want to register.</p></section>

<div class="choice" id="choice">
  <button class="businessChoice" onclick="openBusiness()">🏪 Add Shop / Business<small>Register a local shop or business</small></button>
  <button class="serviceChoice" onclick="openService()">🛠️ Add Service<small>Register yourself as a service provider</small></button>
</div>

<section class="formcard" id="businessWrap">
  <div class="formhead"><h2>🏪 Shop / Business Registration</h2><button class="change" onclick="showChoice()">Change Type</button></div>
  <form id="businessForm" class="formgrid">
    <div class="field"><label>Shop / Business Name *</label><input id="bName" required></div>
    <div class="field"><label>Business Category *</label><select id="bCategory" required><option value="">Select Business Category</option><option>Grocery & General Store</option><option>Clothing & Garments</option><option>Footwear</option><option>Jewellery</option><option>Cosmetics & Beauty Products</option><option>Mobile & Accessories</option><option>Computer & IT</option><option>Electronics & Appliances</option><option>Electrical Shop</option><option>Hardware & Sanitary</option><option>Building Materials</option><option>Paint & Decoration</option><option>Furniture & Furnishing</option><option>Restaurant & Food</option><option>Sweets & Bakery</option><option>Tea, Snacks & Refreshments</option><option>Dairy & Milk Products</option><option>Fruits & Vegetables</option><option>Medical Store & Pharmacy</option><option>Books & Stationery</option><option>Gifts & Toys</option><option>Home & Kitchen</option><option>Agriculture & Farm Supplies</option><option>Animal Feed & Veterinary Supplies</option><option>Cycle & Accessories</option><option>Automobile & Spare Parts</option><option>Fuel & Lubricants</option><option>Automobile Repair & Workshop</option><option>Photography & Studio</option><option>Printing & Digital Services</option><option>Salon & Grooming</option><option>Gym & Fitness</option><option>Hotel & Lodge</option><option>Transport & Logistics</option><option>Travel & Ticketing</option><option>Banking & Financial Services</option><option>Insurance Services</option><option>Real Estate & Property</option><option>Flowers & Decoration</option><option>Wedding & Event Services</option><option>Tailoring & Boutique</option><option>Optical Store</option><option>Religious & Puja Items</option><option>Other Shops & Businesses</option></select></div>
    <div class="field"><label>Owner / Contact Person</label><input id="bOwner"></div>
    <div class="field"><label>Mobile Number *</label><input id="bPhone" inputmode="numeric" required></div>
    <div class="field"><label>WhatsApp Number</label><input id="bWhatsapp" inputmode="numeric"></div>
    <div class="field"><label>Ward</label><select id="bWard"><option value="">Select Ward</option><option>Ward 1</option><option>Ward 2</option><option>Ward 3</option><option>Ward 4</option><option>Ward 5</option><option>Ward 6</option><option>Ward 7</option><option>Ward 8</option><option>Ward 9</option><option>Ward 10</option><option>Ward 11</option><option>Ward 12</option><option>Ward 13</option><option>Ward 14</option><option>Ward 15</option><option>Ward 16</option><option>Ward 17</option><option>Ward 18</option></select></div>
    <div class="field full"><label>Address</label><textarea id="bAddress"></textarea></div>
    <div class="field full"><label>Business Description</label><textarea id="bDescription"></textarea></div>
    <div class="field"><label>WhatsApp Catalogue Link</label><input id="bCatalogue"></div>
    <div class="field full">
      <label>Location</label>
      <input id="bMap" type="hidden">
      <div class="sc-location-row">
        <button type="button" class="mini gps" id="bDetectLocation">📍 Detect Location</button>
        <button type="button" class="mini maps" id="bSelectLocation">🗺️ Select Location</button>
      </div>
      <small id="bLocationStatus" style="font-size:8px;color:#667085"></small>
    </div>
    <div class="field full"><label>Business Image</label><input id="bImage" type="file" accept="image/*" capture="environment"></div>
    <button class="submit" type="submit">Submit Business Registration</button>
    <div id="bStatus" class="status"></div>
  </form>
</section>

<section class="formcard" id="serviceWrap">
  <div class="formhead"><h2>🛠️ Service Provider Registration</h2><button class="change" onclick="showChoice()">Change Type</button></div>
  <form id="serviceForm" class="formgrid">
    <div class="field"><label>Service Provider Name *</label><input id="sName" required></div>
    <div class="field"><label>Service Category *</label><select id="sCategory" required><option value="">Select Service Category</option><option>Mason</option><option>Construction Labour</option><option>Carpenter</option><option>Plumber</option><option>Electrician</option><option>Welder</option><option>Painter</option><option>Tile / Marble Fitter</option><option>POP / False Ceiling Worker</option><option>Aluminium / Glass Worker</option><option>Borewell / Water Pump Mechanic</option><option>Key Maker / Locksmith</option><option>Septic Tank / Toilet Tank Cleaner</option><option>Drain / Sewer Cleaner</option><option>House Cleaner</option><option>Pest Control Service</option><option>Gardener / Mali</option><option>Tree Cutting / Trimming Service</option><option>Domestic Help / Maid</option><option>CCTV Technician</option><option>AC Technician</option><option>Refrigerator Technician</option><option>Washing Machine Technician</option><option>Cooler Technician</option><option>RO / Water Purifier Technician</option><option>TV Technician</option><option>Mobile Repair Technician</option><option>Computer / Laptop Technician</option><option>Printer / Photocopier Technician</option><option>Internet / Wi-Fi Technician</option><option>DTH / Dish TV Technician</option><option>Bike Mechanic</option><option>Car Mechanic</option><option>Auto / E-rickshaw Mechanic</option><option>Tractor Mechanic</option><option>Tyre / Puncture Repair</option><option>Driver</option><option>Cycle Repair</option><option>Rickshaw / Cart Service</option><option>Loader / Goods Labour</option><option>Packers & Movers</option><option>Local Goods Delivery</option><option>Milkman / Milk Delivery</option><option>Newspaper Delivery</option><option>Drinking Water / Water Jar Delivery</option><option>LPG / Gas Delivery Contact</option><option>Cook</option><option>Caterer</option><option>Waiter / Event Helper</option><option>Tent House Service</option><option>Decoration Service</option><option>Lighting Decoration</option><option>DJ / Sound Service</option><option>Band / Music Service</option><option>Photographer</option><option>Videographer</option><option>Makeup Artist</option><option>Mehndi Artist</option><option>Tailor</option><option>Laundry / Dhobi</option><option>Barber / Home Haircut</option><option>Private Tutor / Home Tutor</option><option>Tractor / Rotavator Service</option><option>Harvester / Farm Machinery Service</option><option>Pandit Ji / Purohit</option></select></div>
    <div class="field"><label>Mobile Number *</label><input id="sPhone" inputmode="numeric" required></div>
    <div class="field"><label>WhatsApp Number</label><input id="sWhatsapp" inputmode="numeric"></div>
    <div class="field full"><label>Service Description *</label><textarea id="sDescription" required></textarea></div>
    <div class="field"><label>Experience</label><select id="sExperience"><option value="">Select Experience</option><option>Less than 1 year</option><option>1 year</option><option>2 years</option><option>3 years</option><option>4 years</option><option>5 years</option><option>6 years</option><option>7 years</option><option>8 years</option><option>9 years</option><option>10 years</option><option>More than 10 years</option></select></div>
    <div class="field full"><label>Profile Image *</label><input id="sImage" type="file" accept="image/*" capture="environment" required></div>
    <button class="submit" type="submit">Submit Service Registration</button>

  </form>
</section>
</main>
<nav class="bottom"><a href="../">⌂<span>Home</span></a><a href="businesses.html">🏪<span>Shop</span></a><a href="services.html">🛠️<span>Services</span></a><a href="events.html">📅<span>Events</span></a><a href="settings.html">☰<span>Menu</span></a></nav>
<script>
const API="https://script.google.com/macros/s/AKfycbzrDLNOj56LEjyLuf4PJiBsH5s36RgRi6y55NjjVJtxvRjFPUMdcXLsOK4ojNUssdNX/exec";
function fileData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function post(data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});const x=await r.json();if(!x||!x.success)throw Error(x&&x.error?x.error:'Submission failed.');return x}
function showChoice(){choice.style.display='grid';businessWrap.classList.remove('open');serviceWrap.classList.remove('open')}
function openBusiness(){choice.style.display='none';businessWrap.classList.add('open');serviceWrap.classList.remove('open');if(window.SCAccountUI)SCAccountUI.autofill(businessWrap)}
function openService(){choice.style.display='none';businessWrap.classList.remove('open');serviceWrap.classList.add('open');if(window.SCAccountUI)SCAccountUI.autofill(serviceWrap)}
businessForm.addEventListener('submit',async e=>{e.preventDefault();bStatus.className='status';bStatus.textContent='Submitting...';try{const img=bImage.files[0];const d={action:'registerBusiness',businessName:bName.value.trim(),businessCategory:bCategory.value,category:bCategory.value,owner:bOwner.value.trim(),contactNumber:bPhone.value.trim(),phone:bPhone.value.trim(),whatsAppNumber:bWhatsapp.value.trim(),whatsapp:bWhatsapp.value.trim(),ward:bWard.value,address:bAddress.value.trim(),description:bDescription.value.trim(),catalogue:bCatalogue.value.trim(),location:bMap.value.trim(),map:bMap.value.trim()};if(img){d.imageBase64=await fileData(img);d.imageName=img.name;d.imageMimeType=img.type}const x=await post(d);bStatus.className='status ok';bStatus.textContent=(x.data&&x.data.message)||'Business registration submitted successfully.';businessForm.reset()}catch(err){bStatus.className='status err';bStatus.textContent=err.message}});
serviceForm.addEventListener('submit',async e=>{e.preventDefault();sStatus.className='status';sStatus.textContent='Submitting...';try{const img=sImage.files[0];if(!img)throw Error('Please upload profile image.');const d={action:'registerService',servicePersonName:sName.value.trim(),businessName:sName.value.trim(),category:sCategory.value,serviceType:sCategory.value,phone:sPhone.value.trim(),whatsapp:sWhatsapp.value.trim(),description:sDescription.value.trim(),experience:sExperience.value,imageBase64:await fileData(img),imageName:img.name,imageMimeType:img.type};const x=await post(d);sStatus.className='status ok';sStatus.textContent=(x.data&&x.data.message)||'Service registration submitted successfully.';serviceForm.reset()}catch(err){sStatus.className='status err';sStatus.textContent=err.message}});
</script>
<script src="../app-account.js"></script>
<script src="../app-media.js"></script>
<style>
.sc-location-row{display:flex;gap:8px;flex-wrap:wrap}
.sc-location-row button{border:0;border-radius:10px;padding:9px 10px;font-size:9px;font-weight:900;color:#fff}
.sc-location-row .gps{background:#238b45}.sc-location-row .maps{background:#2563eb}
</style>
<script>
(function(){
  const hidden=document.getElementById("bMap");
  const status=document.getElementById("bLocationStatus");
  const detect=document.getElementById("bDetectLocation");
  const select=document.getElementById("bSelectLocation");
  if(!hidden||!status||!detect||!select)return;
  function setLocation(lat,lng){
    hidden.value=String(lat)+","+String(lng);
    status.textContent="Location selected: "+Number(lat).toFixed(5)+", "+Number(lng).toFixed(5);
  }
  detect.onclick=function(){
    if(!navigator.geolocation){status.textContent="Location is not supported on this device.";return}
    status.textContent="Detecting location...";
    navigator.geolocation.getCurrentPosition(
      p=>setLocation(p.coords.latitude,p.coords.longitude),
      ()=>status.textContent="Unable to detect location. Please allow location permission.",
      {enableHighAccuracy:true,timeout:12000}
    );
  };
  select.onclick=function(){
    // This gives a simple selection method without asking for a Google Maps link.
    const current=hidden.value||"";
    const value=prompt("Enter selected coordinates as latitude,longitude",current);
    if(!value)return;
    const m=value.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
    if(!m){status.textContent="Please select a valid latitude and longitude.";return}
    setLocation(m[1],m[2]);
  };
})();
</script>
</body></html>
