<style>
#sc-government-services{
  --green:#238b45;
  --green-dark:#176b35;
  --saffron:#f28c28;

  --saffron-soft:#fff3e4;

  --border:#e7e7e7;

  max-width:1150px;
  margin:25px auto;
  padding:0 16px 45px;
  font-family:Arial,Helvetica,sans-serif;

}

#sc-government-services *{
  box-sizing:border-box;
}

/* HERO */

.sc-gs-hero{
  position:relative;
  overflow:hidden;

  background:linear-gradient(
    135deg,
    #f7a13f,
    #f28c28,
    #e97812
  );

  color:#fff;

  padding:38px 24px;
  border-radius:21px;
  margin-bottom:22px;
  text-align:center;

  box-shadow:
    0 12px 30px rgba(0,0,0,.13);
}

.sc-gs-hero::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-60px;
  bottom:-90px;
  border-radius:50%;
  background:rgba(255,255,255,.09);
}

.sc-gs-hero h1{
  position:relative;
  z-index:2;
  margin:0 0 9px;
  font-size:clamp(28px,5vw,41px);
}

.sc-gs-hero p{
  position:relative;
  z-index:2;
  max-width:760px;
  margin:auto;
  line-height:1.6;
  font-size:14px;
}

/* SEARCH */

.sc-gs-search{
  position:relative;
  z-index:2;

  max-width:700px;
  margin:22px auto 0;

  display:flex;

  background:#fff;
  padding:6px;

  border-radius:40px;

  box-shadow:
    0 6px 18px rgba(0,0,0,.10);
}

.sc-gs-search input{
  flex:1;
  min-width:0;

  border:0;
  outline:0;

  padding:13px 16px;

  font-size:14px;

  background:transparent;
}

.sc-gs-search button{
  border:0;

  background:var(--green);
  color:#fff;

  padding:0 21px;

  border-radius:35px;

  font-weight:700;
  cursor:pointer;
}

/* FILTERS */

.sc-gs-filter{
  display:flex;
  flex-wrap:wrap;
  gap:8px;

  padding:3px 0 19px;
}

.sc-gs-filter button{
  border:1px solid #ddd;

  background:#fff;

  color:var(--green-dark);

  padding:9px 15px;

  border-radius:25px;

  cursor:pointer;

  font-size:12px;
  font-weight:700;
}

.sc-gs-filter button.active{
  background:var(--saffron);
  border-color:var(--saffron);
  color:#fff;
}

.sc-gs-count{
  margin-bottom:14px;
  font-size:13px;
  color:var(--muted);
}

/* GRID */

.sc-gs-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:18px;
}

/* CARD */

.sc-gs-card{
  display:flex;
  flex-direction:column;

  background:#fff;

  padding:20px;

  border-radius:18px;

  border:1px solid var(--border);
  border-top:4px solid var(--saffron);

  box-shadow:
    0 7px 24px rgba(0,0,0,.08);

  transition:.2s ease;
}

.sc-gs-card:hover{
  transform:translateY(-4px);

  box-shadow:
    0 14px 30px rgba(0,0,0,.12);
}

/* ICON */

.sc-gs-icon{
  width:56px;
  height:56px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:15px;

  background:var(--saffron-soft);

  font-size:28px;

  margin-bottom:12px;
}

/* CATEGORY */

.sc-gs-category{
  display:inline-block;
  align-self:flex-start;

  background:var(--saffron-soft);
  color:#b85c00;

  padding:5px 10px;

  border-radius:20px;

  font-size:10px;
  font-weight:700;

  margin-bottom:9px;
}

/* TITLE */

.sc-gs-card h3{
  margin:0 0 10px;

  color:var(--text);

  font-size:19px;

  line-height:1.35;
}

/* INFORMATION */

.sc-gs-info{
  color:var(--muted);

  font-size:12px;

  line-height:1.7;
}

.sc-gs-info-row{
  margin-bottom:8px;
}

.sc-gs-info strong{
  color:var(--text);
}

/* BUTTONS */

.sc-gs-actions{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:8px;

  margin-top:auto;

  padding-top:17px;
}

.sc-gs-actions a,
.sc-gs-actions button{
  min-height:43px;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  text-decoration:none;

  border:0;

  padding:9px 7px;

  border-radius:9px;

  font-family:inherit;

  font-size:11px;

  font-weight:800;

  cursor:pointer;
}

/* OFFICIAL PORTAL */

.sc-gs-open{
  background:var(--blue);
  color:#fff !important;
}

.sc-gs-open:hover{
  background:var(--blue-dark);
}

/* CALL */

.sc-gs-call{
  background:var(--green);
  color:#fff !important;
}

.sc-gs-call:hover{
  background:var(--green-dark);
}

/* EMPTY */

.sc-gs-empty{
  grid-column:1/-1;

  background:#fff;

  border-top:4px solid var(--saffron);

  padding:40px 15px;

  border-radius:18px;

  text-align:center;

  color:var(--muted);
}

/* RESPONSIVE */

@media(max-width:900px){

  .sc-gs-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

@media(max-width:560px){

  .sc-gs-grid{
    grid-template-columns:1fr;
  }

  .sc-gs-search{
    flex-direction:column;
    border-radius:14px;
    gap:5px;
  }

  .sc-gs-search button{
    padding:11px;
  }

  .sc-gs-hero{
    padding:29px 18px;
  }

}

     HERO

<section class="sc-gs-hero">

  <h1>
    🏛️ Government Services

    citizen facilities, schemes and public-service information.
  </p>

    <input
      id="scGsSearch"
      type="search"
      placeholder="Search certificate, pension, ration, land, scheme..."
      oninput="scGsRender()">


    <button
      type="button"
      onclick="scGsRender()">

      🔍 Search

    </button>

  </div>

</section>


<!-- =========================================================
     CATEGORY FILTER
     ========================================================= -->

<div
  class="sc-gs-filter"
  id="scGsCategories">
</div>


<div
  class="sc-gs-count"
  id="scGsCount">

  Loading government services...

</div>


<!-- =========================================================
     SERVICES
     ========================================================= -->

<div
  class="sc-gs-grid"
  id="scGsGrid">

  <div class="sc-gs-empty">
    Loading government services...
  </div>

</div>


<script>

/* =========================================================
   API
   ========================================================= */

const SC_GS_API =
"https://script.google.com/macros/s/AKfycbzrDLNOj56LEjyLuf4PJiBsH5s36RgRi6y55NjjVJtxvRjFPUMdcXLsOK4ojNUssdNX/exec";


let scGsData = [];

let scGsCategory = "All";


/* =========================================================
   LOAD
   ========================================================= */

async function scGsLoad(){

  try{

    const response =
      await fetch(
        SC_GS_API +
        "?action=governmentServices"
      );


    const result =
      await response.json();


    if(
      !result ||
      !result.success ||
      !Array.isArray(result.data)
    ){

      throw new Error(
        "Government service data unavailable"
      );

    }


    scGsData =
      result.data.filter(
        function(item){

          const status =
            String(
              item.Status || ""
            )
            .trim()
            .toLowerCase();


          return (
            !status ||
            status === "active" ||
            status === "yes"
          );

        }
      );


    scGsCreateCategories();

    scGsRender();

  }

  catch(error){

    console.error(
      "Government Services:",
      error
    );


    document.getElementById(
      "scGsGrid"
    ).innerHTML = `

      <div class="sc-gs-empty">

        Unable to load government services.

      </div>

    `;


    document.getElementById(
      "scGsCount"
    ).textContent =
      "Unable to load data.";

  }

}


/* =========================================================
   CREATE CATEGORIES
   ========================================================= */

function scGsCreateCategories(){

  const holder =
    document.getElementById(
      "scGsCategories"
    );


  const categories = [

    "All",

    ...new Set(

      scGsData

      .map(
        function(item){

          return String(
            item.Category || ""
          ).trim();

        }
      )

      .filter(Boolean)

    )

  ];


  holder.innerHTML =
    categories.map(
      function(category){

        return `

          <button
            type="button"
            class="${
              category === "All"
                ? "active"
                : ""
            }"
            data-category="${scGsEsc(category)}">

            ${scGsEsc(category)}

          </button>

        `;

      }
    )
    .join("");


  holder
    .querySelectorAll("button")
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            holder
              .querySelectorAll("button")
              .forEach(
                function(btn){

                  btn.classList.remove(
                    "active"
                  );

                }
              );


            button.classList.add(
              "active"
            );


            scGsCategory =
              button.getAttribute(
                "data-category"
              );


            scGsRender();

          }
        );

      }
    );

}


/* =========================================================
   RENDER
   ========================================================= */

function scGsRender(){

  const grid =
    document.getElementById(
      "scGsGrid"
    );


  const count =
    document.getElementById(
      "scGsCount"
    );


  const search =
    document.getElementById(
      "scGsSearch"
    )
    .value
    .trim()
    .toLowerCase();


  const filtered =
    scGsData.filter(
      function(item){

        const category =
          String(
            item.Category || ""
          ).trim();


        const searchable =
          Object.values(item)
          .join(" ")
          .toLowerCase();


        return (

          (
            scGsCategory === "All" ||
            category === scGsCategory
          )

          &&

          (
            !search ||
            searchable.includes(search)
          )

        );

      }
    );


  count.textContent =

    filtered.length +

    (
      filtered.length === 1
        ? " service found"
        : " services found"
    );


  if(
    !filtered.length
  ){

    grid.innerHTML = `

      <div class="sc-gs-empty">

        No matching government service found.

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered.map(
      function(item){


        const name =
          item["Service Name"] ||
          "Government Service";


        const category =
          item.Category ||
          "Government Service";


        const department =
          item.Department ||
          "";


        const description =
          item.Description ||
          "";


        const eligibility =
          item.Eligibility ||
          "";


        const documents =
          item["Documents Required"] ||
          "";


        const link =
          item["Official Link"] ||
          "";


        const phone =
          item["Helpline Number"] ||
          "";


        return `

          <article class="sc-gs-card">


            <div class="sc-gs-icon">

              ${scGsIcon(category)}

            </div>


            <span class="sc-gs-category">

              ${scGsEsc(category)}

            </span>


            <h3>

              ${scGsEsc(name)}

            </h3>


            <div class="sc-gs-info">


              ${
                department

                ? `

                  <div class="sc-gs-info-row">

                    🏢

                    <strong>
                      Department:
                    </strong>

                    ${scGsEsc(department)}

                  </div>

                `

                : ""
              }


              ${
                description

                ? `

                  <div class="sc-gs-info-row">

                    📝
                    ${scGsEsc(description)}

                  </div>

                `

                : ""
              }


              ${
                eligibility

                ? `

                  <div class="sc-gs-info-row">

                    ✅

                    <strong>
                      Eligibility:
                    </strong>

                    ${scGsEsc(eligibility)}

                  </div>

                `

                : ""
              }


              ${
                documents

                ? `

                  <div class="sc-gs-info-row">

                    📄

                    <strong>
                      Documents:
                    </strong>

                    ${scGsEsc(documents)}

                  </div>

                `

                : ""
              }


            </div>


            <div class="sc-gs-actions">


              ${
                scGsValidUrl(link)

                ? `

                  <a
                    class="sc-gs-open"
                    href="${scGsUrl(link)}"
                    target="_blank"
                    rel="noopener noreferrer">

                    🌐 Open Official Portal

                  </a>

                `

                : `

                  <button
                    type="button"
                    class="sc-gs-open"
                    onclick="scGsPortalUnavailable()">

                    🌐 Open Official Portal

                  </button>

                `
              }


              ${
                phone

                ? `

                  <a
                    class="sc-gs-call"
                    href="tel:${scGsPhone(phone)}">

                    📞 Call Helpline

                  </a>

                `

                : `

                  <button
                    type="button"
                    class="sc-gs-call"
                    onclick="scGsPhoneUnavailable()">

                    📞 Call Helpline

                  </button>

                `
              }


            </div>


          </article>

        `;

      }
    )
    .join("");

}


/* =========================================================
   ICON
   ========================================================= */

function scGsIcon(category){

  const value =
    String(
      category || ""
    )
    .toLowerCase();


  if(
    value.includes("certificate")
  )
    return "📜";


  if(
    value.includes("ration")
  )
    return "🌾";


  if(
    value.includes("pension")
  )
    return "👴";


  if(
    value.includes("land")
  )
    return "🗺️";


  if(
    value.includes("tax")
  )
    return "💰";


  if(
    value.includes("scheme")
  )
    return "🎯";


  if(
    value.includes("identity")
  )
    return "🪪";


  if(
    value.includes("birth")
  )
    return "👶";


  if(
    value.includes("death")
  )
    return "📄";


  if(
    value.includes("education")
  )
    return "🎓";


  if(
    value.includes("health")
  )
    return "🏥";


  return "🏛️";

}


/* =========================================================
   PHONE
   ========================================================= */

function scGsPhone(value){

  return String(
    value || ""
  )
  .replace(
    /[^0-9+]/g,
    ""
  );

}


/* =========================================================
   VALID URL
   ========================================================= */

function scGsValidUrl(value){

  const url =
    String(
      value || ""
    )
    .trim();


  return (

    url.startsWith(
      "https://"
    )

    ||

    url.startsWith(
      "http://"
    )

  );

}


/* =========================================================
   URL
   ========================================================= */

function scGsUrl(value){

  return scGsEsc(
    String(
      value || ""
    ).trim()
  );

}


/* =========================================================
   FALLBACK BUTTONS
   ========================================================= */

function scGsPortalUnavailable(){

  alert(
    "Official portal link is currently unavailable."
  );

}


function scGsPhoneUnavailable(){

  alert(
    "Helpline number is currently unavailable."
  );

}


/* =========================================================
   ESCAPE
   ========================================================= */

function scGsEsc(value){

  return String(
    value == null
      ? ""
      : value
  )

  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================================
   START
   ========================================================= */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    scGsLoad
  );

}

else{

  scGsLoad();

}

</script>
