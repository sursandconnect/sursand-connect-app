<script>

/* =========================================================
   API
   ========================================================= */

const SC_NT_API =
"https://script.google.com/macros/s/AKfycbzrDLNOj56LEjyLuf4PJiBsH5s36RgRi6y55NjjVJtxvRjFPUMdcXLsOK4ojNUssdNX/exec";


let scNtData = [];

let scNtCategory =
  "All";


let scNtPostMap =
  {};


/* =========================================================
   LOAD CLEARED IDs
   ========================================================= */

function scNtGetCleared(){

  try{

    const value =
      localStorage.getItem(
        "SC_CLEARED_NOTIFICATIONS"
      );


    if(!value){
      return [];
    }


    const parsed =
      JSON.parse(value);


    return Array.isArray(parsed)
      ? parsed
      : [];

  }

  catch(error){

    return [];

  }

}


/* =========================================================
   SAVE CLEARED IDs
   ========================================================= */

function scNtSaveCleared(ids){

  localStorage.setItem(

    "SC_CLEARED_NOTIFICATIONS",

    JSON.stringify(ids)

  );

}


/* =========================================================
   RECORD KEY
   ========================================================= */

function scNtKey(item){

  if(item.ID){
    return String(item.ID);
  }


  const title =

    item.Title ||

    item["Notification Title"] ||

    item["Update Title"] ||

    item.Name ||

    "";


  const date =

    item.Date ||

    item["Published Date"] ||

    item["Update Date"] ||

    "";


  return (
    String(title) +
    "|" +
    String(date)
  );

}


/* =========================================================
   LOAD BLOGGER POST URL MAP
   ========================================================= */

async function scNtLoadPostMap(){

  try{

    const response =
      await fetch(

        "/feeds/posts/default?alt=json&max-results=500",

        {
          cache:"no-store"
        }

      );


    const result =
      await response.json();


    const entries =

      result &&
      result.feed &&
      result.feed.entry

        ? result.feed.entry

        : [];


    entries.forEach(
      function(entry){

        const title =

          entry.title &&
          entry.title.$t

            ? String(
                entry.title.$t
              ).trim()

            : "";


        const links =
          entry.link || [];


        const alternate =
          links.find(
            function(link){

              return (
                link.rel ===
                "alternate"
              );

            }
          );


        if(
          title &&
          alternate &&
          alternate.href
        ){

          scNtPostMap[
            title.toLowerCase()
          ] =
            alternate.href;

        }

      }
    );

  }

  catch(error){

    console.warn(
      "Notification page map:",
      error
    );

  }

}


/* =========================================================
   LOAD NOTIFICATIONS
   ========================================================= */

async function scNtLoad(){

  try{

    await scNtLoadPostMap();


    const response =
      await fetch(
        SC_NT_API +
        "?action=all"
      );


    const result =
      await response.json();


    if(
      !result ||
      !result.success
    ){

      throw new Error(
        "API data unavailable"
      );

    }


    const data =
      result.data || {};


    scNtData =

      data.notifications ||

      data.updates ||

      data.notificationsUpdates ||

      data.localUpdates ||

      [];


    if(
      !Array.isArray(
        scNtData
      )
    ){

      scNtData = [];

    }


    scNtCreateCategories();

    scNtRender();

  }

  catch(error){

    console.error(

      "Notifications & Updates:",

      error

    );


    document.getElementById(
      "scNtList"
    ).innerHTML = `

      <div class="sc-nt-empty">

        Unable to load notifications.

      </div>

    `;


    document.getElementById(
      "scNtCount"
    ).textContent =
      "Unable to load data.";

  }

}


/* =========================================================
   CATEGORIES
   ========================================================= */

function scNtCreateCategories(){

  const holder =
    document.getElementById(
      "scNtCategories"
    );


  const categories = [

    "All",

    ...new Set(

      scNtData

        .map(function(item){

          return (

            item.Category ||

            item.category ||

            item.Type ||

            item[
              "Notification Type"
            ] ||

            ""

          );

        })

        .filter(Boolean)

    )

  ];


  holder.innerHTML =
    "";


  categories.forEach(
    function(category){

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.textContent =
        category;


      if(
        category === "All"
      ){

        button.classList.add(
          "active"
        );

      }


      button.addEventListener(

        "click",

        function(){

          holder

            .querySelectorAll(
              "button"
            )

            .forEach(
              function(btn){

                btn.classList.remove(
                  "active"
                );

              }
            );


          button.classList.add(
            "active"
          );


          scNtCategory =
            category;


          scNtRender();

        }

      );


      holder.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   GET RELATED TARGET
   ========================================================= */

function scNtTarget(item){

  /* -----------------------------------------
     DIRECT RELATED URL
     ----------------------------------------- */

  const directUrl =

    item["Related URL"] ||

    item["Target URL"] ||

    item["Page URL"] ||

    item["Post URL"] ||

    item["More Info Link"] ||

    item.Link ||

    item.URL ||

    "";


  if(
    scNtValidUrl(
      directUrl
    )
  ){

    return String(
      directUrl
    ).trim();

  }


  /* -----------------------------------------
     RELATED BLOGGER PAGE/POST TITLE
     ----------------------------------------- */

  const pageTitle =

    item["Related Page"] ||

    item["Related Post"] ||

    item["Target Page"] ||

    item["Page Title"] ||

    "";


  if(pageTitle){

    const key =
      String(pageTitle)
        .trim()
        .toLowerCase();


    if(
      scNtPostMap[key]
    ){

      return scNtPostMap[key];

    }


    /*
     * Fallback if exact Blogger post
     * has not yet been resolved.
     */

    return (

      "/search?q=" +

      encodeURIComponent(
        pageTitle
      )

    );

  }


  return "";

}


/* =========================================================
   CARD CLICK
   ========================================================= */

function scNtOpenItem(index){

  const item =
    scNtData[index];


  if(!item){
    return;
  }


  const target =
    scNtTarget(item);


  if(target){

    window.location.href =
      target;

  }

}


/* =========================================================
   RENDER
   ========================================================= */

function scNtRender(){

  const list =
    document.getElementById(
      "scNtList"
    );


  const count =
    document.getElementById(
      "scNtCount"
    );


  const cleared =
    scNtGetCleared();


  const search =
    document

      .getElementById(
        "scNtSearch"
      )

      .value

      .trim()

      .toLowerCase();


  const filtered =
    scNtData.filter(
      function(item){

        /* CLEARED */

        if(
          cleared.includes(
            scNtKey(item)
          )
        ){

          return false;

        }


        /* CATEGORY */

        const category =
          String(

            item.Category ||

            item.category ||

            item.Type ||

            item[
              "Notification Type"
            ] ||

            ""

          );


        /* SEARCH */

        const searchable =

          Object.values(item)

            .join(" ")

            .toLowerCase();


        return (

          (
            scNtCategory ===
              "All"

            ||

            category ===
              scNtCategory
          )

          &&

          (
            !search

            ||

            searchable.includes(
              search
            )
          )

        );

      }
    );


  count.textContent =

    filtered.length +

    (
      filtered.length === 1

        ? " update"

        : " updates"
    );


  if(
    !filtered.length
  ){

    list.innerHTML = `

      <div class="sc-nt-empty">

        No notifications or updates.

      </div>

    `;


    return;

  }


  list.innerHTML =
    "";


  filtered.forEach(
    function(item){

      const actualIndex =
        scNtData.indexOf(item);


      list.appendChild(

        scNtCreateCard(
          item,
          actualIndex
        )

      );

    }
  );

}


/* =========================================================
   CREATE CARD
   ========================================================= */

function scNtCreateCard(
  item,
  index
){

  const title =

    item.Title ||

    item["Notification Title"] ||

    item["Update Title"] ||

    item.Name ||

    "Local Update";


  const category =

    item.Category ||

    item.category ||

    item.Type ||

    item["Notification Type"] ||

    "Update";


  const date =

    item.Date ||

    item["Published Date"] ||

    item["Update Date"] ||

    "";


  const description =

    item.Description ||

    item.Message ||

    item.Details ||

    "";


  const priority =
    String(

      item.Priority ||

      item.Urgency ||

      ""

    ).toLowerCase();


  const phone =

    item.Phone ||

    item["Contact Number"] ||

    "";


  const detailsLink =

    item["More Info Link"] ||

    item.Link ||

    item.URL ||

    "";


  const map =

    item["Google Map Link"] ||

    item["Google Maps Link"] ||

    item["Map URL"] ||

    item.Map ||

    "";


  const urgent =

    priority.includes(
      "urgent"
    )

    ||

    priority.includes(
      "high"
    )

    ||

    String(category)

      .toLowerCase()

      .includes(
        "emergency"
      );


  const target =
    scNtTarget(item);


  const article =
    document.createElement(
      "article"
    );


  article.className =
    "sc-nt-card" +
    (
      urgent
        ? " urgent"
        : ""
    );


  if(target){

    article.setAttribute(
      "role",
      "link"
    );


    article.setAttribute(
      "tabindex",
      "0"
    );


    article.addEventListener(
      "click",
      function(){

        scNtOpenItem(
          index
        );

      }
    );


    article.addEventListener(
      "keydown",
      function(event){

        if(
          event.key ===
            "Enter"

          ||

          event.key ===
            " "
        ){

          event.preventDefault();

          scNtOpenItem(
            index
          );

        }

      }
    );

  }


  const top =
    document.createElement(
      "div"
    );


  top.className =
    "sc-nt-top";


  const left =
    document.createElement(
      "div"
    );


  const badge =
    document.createElement(
      "span"
    );


  badge.className =
    "sc-nt-badge";


  badge.textContent =
    urgent
      ? "⚠️ " + category
      : "🔔 " + category;


  left.appendChild(
    badge
  );


  const heading =
    document.createElement(
      "h3"
    );


  heading.textContent =
    title;


  left.appendChild(
    heading
  );


  top.appendChild(
    left
  );


  if(date){

    const dateElement =
      document.createElement(
        "div"
      );


    dateElement.className =
      "sc-nt-date";


    dateElement.textContent =
      "📅 " + date;


    top.appendChild(
      dateElement
    );

  }


  article.appendChild(
    top
  );


  /* DESCRIPTION */

  if(description){

    const desc =
      document.createElement(
        "div"
      );


    desc.className =
      "sc-nt-desc";


    desc.textContent =
      description;


    article.appendChild(
      desc
    );

  }


  /* CARD REDIRECTION HINT */

  if(target){

    const hint =
      document.createElement(
        "div"
      );


    hint.className =
      "sc-nt-open-hint";


    hint.textContent =
      "Tap to open related page →";


    article.appendChild(
      hint
    );

  }


  /* ACTIONS */

  const actions =
    document.createElement(
      "div"
    );


  actions.className =
    "sc-nt-actions";


  /* CALL */

  if(phone){

    const call =
      document.createElement(
        "a"
      );


    call.className =
      "sc-nt-call";


    call.href =
      "tel:" +
      scNtPhone(phone);


    call.textContent =
      "📞 Call";


    call.addEventListener(
      "click",
      function(event){

        event.stopPropagation();

      }
    );


    actions.appendChild(
      call
    );

  }


  /* MORE DETAILS */

  if(
    scNtValidUrl(
      detailsLink
    )
  ){

    const details =
      document.createElement(
        "a"
      );


    details.className =
      "sc-nt-link";


    details.href =
      String(
        detailsLink
      ).trim();


    details.target =
      "_blank";


    details.rel =
      "noopener";


    details.textContent =
      "🔗 More Details";


    details.addEventListener(
      "click",
      function(event){

        event.stopPropagation();

      }
    );


    actions.appendChild(
      details
    );

  }


  /* DIRECTIONS */

  if(
    scNtValidUrl(
      map
    )
  ){

    const directions =
      document.createElement(
        "a"
      );


    directions.className =
      "sc-nt-map";


    directions.href =
      String(map).trim();


    directions.target =
      "_blank";


    directions.rel =
      "noopener";


    directions.textContent =
      "🧭 Get Directions";


    directions.addEventListener(
      "click",
      function(event){

        event.stopPropagation();

      }
    );


    actions.appendChild(
      directions
    );

  }


  if(
    actions.children.length
  ){

    article.appendChild(
      actions
    );

  }


  return article;

}


/* =========================================================
   CLEAR ALL
   ========================================================= */

function scNtClearAll(){

  const visible =
    scNtData.filter(
      function(item){

        const category =
          String(

            item.Category ||

            item.category ||

            item.Type ||

            item[
              "Notification Type"
            ] ||

            ""

          );


        return (

          scNtCategory === "All"

          ||

          category ===
            scNtCategory

        );

      }
    );


  if(
    !visible.length
  ){

    return;

  }


  const confirmed =
    window.confirm(

      "Clear all notifications from this device?"

    );


  if(!confirmed){

    return;

  }


  const cleared =
    scNtGetCleared();


  visible.forEach(
    function(item){

      const key =
        scNtKey(item);


      if(
        !cleared.includes(
          key
        )
      ){

        cleared.push(
          key
        );

      }

    }
  );


  scNtSaveCleared(
    cleared
  );


  scNtRender();

}


/* =========================================================
   PHONE
   ========================================================= */

function scNtPhone(value){

  return String(
    value || ""
  )
    .replace(
      /[^0-9+]/g,
      ""
    );

}


/* =========================================================
   VALID URL
   ========================================================= */

function scNtValidUrl(value){

  const url =
    String(
      value || ""
    )
      .trim();


  return (

    url.startsWith(
      "https://"
    )

    ||

    url.startsWith(
      "http://"
    )

  );

}


/* =========================================================
   START
   ========================================================= */

if(
  document.readyState ===
    "loading"
){

  document.addEventListener(

    "DOMContentLoaded",

    scNtLoad

  );

}

else{

  scNtLoad();

}
