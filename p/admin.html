<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e97712">
<title>Admin Panel | Sursand Connect</title>
<style>
:root{--s:#f28c28;--g:#238b45;--text:#263238;--muted:#667085;--border:#e6ebe7;--bg:#f8fafc}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}body{padding-top:66px;padding-bottom:110px}
.bar{position:fixed;top:0;left:0;right:0;height:58px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:4px 12px;z-index:99;border-bottom:1px solid #eceff1;box-shadow:0 5px 18px rgba(15,23,42,.08)}.brand{display:flex;gap:9px;align-items:center;text-decoration:none;color:#263238}.brand img{width:41px;height:41px;border-radius:12px;object-fit:contain}.brand span{display:flex;flex-direction:column}.brand b{font-size:14px}.brand small{font-size:9px;color:#667085}.back{width:40px;height:40px;border-radius:14px;border:1px solid #f2d1ac;background:#fff0dd;color:#c86508;font-size:20px}
.wrap{max-width:1200px;margin:14px auto;padding:0 12px 40px}.hero{background:linear-gradient(135deg,#334155,#111827);color:#fff;border-radius:20px;padding:24px 17px;box-shadow:0 12px 28px rgba(15,23,42,.18)}.hero h1{margin:0 0 5px;color:#fff;font-size:24px}.hero p{margin:0;font-size:10px;line-height:1.5;color:#dbe4ee}
.top{display:flex;justify-content:space-between;align-items:center;margin:15px 0 10px}.top h2{font-size:15px;margin:0}.top-actions{display:flex;gap:7px;flex-wrap:wrap}.smallbtn{border:0;border-radius:9px;padding:8px 10px;font-size:8px;font-weight:900;cursor:pointer}.orange{background:#fff0dd;color:#c86508}.red{background:#fff1f1;color:#b91c1c}.green{background:#eaf7ed;color:#176b35}
.modules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.module{background:#fff;border:1px solid var(--border);border-radius:14px;padding:11px;box-shadow:0 5px 15px rgba(15,23,42,.06);cursor:pointer}.module i{font-style:normal;font-size:20px}.module b{display:block;font-size:9px;margin-top:6px}.module.active{border-color:#f28c28;background:#fff9f2}
.panel{display:none;background:#fff;border:1px solid var(--border);border-top:4px solid var(--s);border-radius:16px;margin-top:13px;overflow:hidden}.panel.active{display:block}.panelhead{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:11px;border-bottom:1px solid #edf0ee;flex-wrap:wrap}.panelhead h3{margin:0;font-size:12px}.tools{display:flex;gap:6px;flex-wrap:wrap}.tablewrap{overflow:auto;max-height:58vh}table{width:100%;border-collapse:collapse;font-size:8px}th,td{padding:8px;border-bottom:1px solid #edf0ee;text-align:left;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;background:#f8faf8;z-index:2}.row-actions{display:flex;gap:4px}.row-actions button{border:0;border-radius:7px;padding:5px 6px;font-size:7px;font-weight:900}.empty{padding:24px;text-align:center;color:#667085;font-size:9px}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:200;align-items:center;justify-content:center;padding:14px}.modal.active{display:flex}.dialog{width:min(96vw,650px);max-height:88vh;overflow:auto;background:#fff;border-radius:19px;padding:15px;box-shadow:0 25px 70px rgba(0,0,0,.3)}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h3{font-size:14px;margin:0}.close{width:32px;height:32px;border:0;border-radius:9px;background:#f1f5f3;font-size:18px}.editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.ef{display:flex;flex-direction:column;gap:4px}.ef.full{grid-column:1/-1}.ef label{font-size:8px;font-weight:800;color:#475569}.ef input,.ef textarea{width:100%;border:1px solid #dfe5e1;border-radius:9px;padding:9px;font:inherit;font-size:9px}.ef textarea{min-height:70px;resize:vertical}.save{grid-column:1/-1;border:0;border-radius:10px;padding:11px;background:#238b45;color:#fff;font-size:9px;font-weight:900}
.confirmBox{text-align:center}.confirmBox h3{font-size:15px}.confirmBox p{font-size:10px;color:#667085;line-height:1.5}.confirmBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.confirmBtns button{border:0;border-radius:10px;padding:11px;font-weight:900;font-size:9px}
.passbox{display:none;background:#fff;border:1px solid var(--border);border-radius:15px;padding:13px;margin-top:12px}.passbox.active{display:block}.passgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pw{position:relative}.pw input{width:100%;padding:10px 40px 10px 9px;border:1px solid #dfe5e1;border-radius:9px}.pw button{position:absolute;right:4px;top:4px;height:30px;border:0;border-radius:7px;background:#f1f5f3;font-size:7px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:64px;background:linear-gradient(135deg,#f7a13f,#f28c28 52%,#e97812);display:grid;grid-template-columns:repeat(5,1fr);z-index:99}.bottom a{color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px}.bottom span{font-size:8px;font-weight:800}
@media(max-width:760px){.modules{grid-template-columns:repeat(3,1fr)}.editor{grid-template-columns:1fr}.ef.full,.save{grid-column:1}.passgrid{grid-template-columns:1fr}}
</style></head><body>
<header class="bar"><a class="brand" href="../"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgM6ePTCVaqvhVtE9SqPzEyzrYrHjo0MlxUbzHS1D8ORCNX_at01YJcY6a7ltTxA2AaYEuojBw-VotVudZXLNUHVSs6xQvLX6zbNBh-bVnm0v6gURU0yStk_fObHB9rGNwbkf2v_GTyAmcwAG0m8srp0at1riLJSCvOLU3kFneNoNlX-C1XLbioi4RtmDfU/s1600/IMG_20260820_101456.png"><span><b>Sursand Connect</b><small>Administrator Control Centre</small></span></a><button class="back" onclick="location.href='../'">‹</button></header>
<main class="wrap">
<section class="hero"><h1>🛡️ Admin Panel</h1><p>Manage Sursand Connect content, registrations, listings, users, requests, announcements, advertisements and public information.</p></section>
<div class="top"><h2>Control Centre</h2><div class="top-actions"><button class="smallbtn orange" onclick="togglePasswordBox()">🔑 Password</button><button class="smallbtn red" onclick="logoutAdmin()">Logout</button></div></div>
<div class="passbox" id="passBox"><div class="passgrid"><div class="pw"><input id="adminCurPw" type="password" placeholder="Current password"><button onclick="togglePw('adminCurPw',this)">Show</button></div><div class="pw"><input id="adminNewPw" type="password" placeholder="New password"><button onclick="togglePw('adminNewPw',this)">Show</button></div><div class="pw"><input id="adminConfirmPw" type="password" placeholder="Confirm password"><button onclick="togglePw('adminConfirmPw',this)">Show</button></div></div><button class="smallbtn green" style="margin-top:8px" onclick="changeAdminPassword()">Update Admin Password</button></div>
<div class="modules" id="modules"></div>
<section class="panel" id="panel"><div class="panelhead"><h3 id="panelTitle">Management</h3><div class="tools"><button class="smallbtn green" onclick="openEditor(null)">＋ Add</button><button class="smallbtn orange" onclick="refresh()">↻ Refresh</button><button class="smallbtn green" onclick="bulk('approve')">✓ Approve All</button><button class="smallbtn red" onclick="bulk('reject')">✕ Reject All</button></div></div><div id="panelContent" class="empty">Select a module.</div></section>
</main>
<div class="modal" id="editorModal"><div class="dialog"><div class="dialog-head"><h3 id="editorTitle">Edit Record</h3><button class="close" onclick="closeEditor()">×</button></div><form class="editor" id="editorForm" onsubmit="return saveEditor(event)"></form></div></div>
<div class="modal" id="confirmModal"><div class="dialog confirmBox"><h3 id="confirmTitle">Confirm Action</h3><p id="confirmText"></p><div class="confirmBtns"><button style="background:#f1f5f3;color:#475569" onclick="resolveConfirm(false)">Cancel</button><button style="background:#238b45;color:#fff" onclick="resolveConfirm(true)">Confirm</button></div></div></div>
<nav class="bottom"><a href="../">⌂<span>Home</span></a><a href="businesses.html">🏪<span>Shop</span></a><a href="services.html">🛠️<span>Services</span></a><a href="events.html">📅<span>Events</span></a><a href="../" onclick="setTimeout(()=>{const b=document.querySelector('.sc-bottom a:last-child');if(b)b.click()},0)">☰<span>Menu</span></a></nav>
<script>
const API='https://script.google.com/macros/s/AKfycbzrDLNOj56LEjyLuf4PJiBsH5s36RgRi6y55NjjVJtxvRjFPUMdcXLsOK4ojNUssdNX/exec', TOKEN_KEY='scAdminSessionToken', EXP_KEY='scAdminSessionExpiresAt';
let token=localStorage.getItem(TOKEN_KEY)||'', current='', rows=[], editing=null, confirmResolve=null;
const SECTIONS=[
 ['businesses','🏪','Businesses'],['services','🛠️','Local Services'],['healthcare','🏥','Healthcare'],['doctors','👨‍⚕️','Doctors'],
 ['education','🎓','Education'],['transport','🚌','Transport'],['places','📍','Important Places'],['governmentOffices','🏛️','Government Offices'],
 ['events','📅','Events & Announcements'],['notifications','🔔','Notifications'],['representatives','👥','Representatives'],['cityConnect','💬','City Connect'],
 ['changeMakers','✨','Change Makers'],['contacts','✉️','Contact Messages'],['agriculture','🌾','Agriculture'],['usefulLinks','🌐','Useful Links'],
 ['governmentServices','🏢','Government Services'],['importantContacts','☎️','Important Contacts'],['pathology','🧪','Pathology Requests'],['medicineOrders','💊','Medicine Orders'],
 ['jobs','💼','Jobs'],['users','👤','App Users'],['localAds','📣','Local Advertisements'],['settings','⚙️','App Settings'],['emergency','🚨','Emergency']
];
function post(p){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),redirect:'follow'}).then(r=>r.text()).then(t=>{let x;try{x=JSON.parse(t)}catch(e){throw Error('Invalid server response.')}if(!x||x.success!==true)throw Error(x&&x.error?x.error:'Request failed.');return x})}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function idOf(r){return r.ID||r.Id||r.id||r['User ID']||r.Key||r.KEY||''}
function expired(){const e=Number(localStorage.getItem(EXP_KEY)||0);return e&&Date.now()>e}
function guard(){if(!token||expired()){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(EXP_KEY);location.replace('account.html');return false}return true}
function init(){if(!guard())return;modules.innerHTML=SECTIONS.map(s=>`<div class="module" data-section="${s[0]}" onclick="openSection('${s[0]}')"><i>${s[1]}</i><b>${s[2]}</b></div>`).join('')}
function openSection(s){if(!guard())return;current=s;document.querySelectorAll('.module').forEach(x=>x.classList.toggle('active',x.dataset.section===s));panel.classList.add('active');panelTitle.textContent=(SECTIONS.find(x=>x[0]===s)||['','','Management'])[2];panelContent.className='empty';panelContent.textContent='Loading...';post({action:'adminData',section:s,token}).then(r=>{rows=Array.isArray(r.data)?r.data:[];render()}).catch(handleErr)}
function handleErr(e){const m=String(e.message||'');if(/session|login|unauthor|token|expired/i.test(m)){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(EXP_KEY);location.replace('account.html')}else{panelContent.className='empty';panelContent.textContent=m||'Unable to load data.'}}
function refresh(){if(current)openSection(current)}
function render(){if(!rows.length){panelContent.className='empty';panelContent.textContent='No records found.';return}const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(c=>!String(c).startsWith('__'));let h='<div class="tablewrap"><table><thead><tr><th>✓</th>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>';rows.forEach((r,i)=>{h+='<tr><td><input type="checkbox" class="rowcheck" data-i="'+i+'"></td>'+cols.map(c=>'<td title="'+esc(r[c])+'">'+esc(r[c])+'</td>').join('')+'<td><div class="row-actions"><button class="green" onclick="openEditor('+i+')">Edit</button><button class="green" onclick="single('+i+',\'approve\')">Approve</button><button class="red" onclick="single('+i+',\'reject\')">Reject</button><button class="red" onclick="single('+i+',\'delete\')">Delete</button></div></td></tr>'});h+='</tbody></table></div>';panelContent.className='';panelContent.innerHTML=h}
function confirmAction(title,text){confirmTitle.textContent=title;confirmText.textContent=text;confirmModal.classList.add('active');return new Promise(res=>confirmResolve=res)}
function resolveConfirm(v){confirmModal.classList.remove('active');if(confirmResolve){confirmResolve(v);confirmResolve=null}}
async function single(i,op){const r=rows[i],id=idOf(r);if(!id){alert('This record has no editable ID.');return}if(!await confirmAction('Confirm '+op,'Are you sure you want to '+op+' this record?'))return;post({action:'adminUpdate',section:current,operation:op,id,token,data:r}).then(refresh).catch(handleErr)}
async function bulk(op){const ids=[...document.querySelectorAll('.rowcheck:checked')].map(c=>idOf(rows[Number(c.dataset.i)])).filter(Boolean);const target=ids.length?ids:rows.map(idOf).filter(Boolean);if(!target.length){alert('No records available.');return}if(!await confirmAction((op==='approve'?'Approve':'Reject')+' Records',(ids.length?'Selected ':'All ')+target.length+' records will be '+(op==='approve'?'approved.':'rejected.')))return;post({action:'adminBulkUpdate',section:current,operation:op,ids:target,token}).then(r=>{alert(r.data&&r.data.message?r.data.message:'Completed.');refresh()}).catch(handleErr)}
function openEditor(i){editing=i===null?null:rows[i];const sample=editing||(rows[0]||{});const cols=Object.keys(sample).filter(c=>!String(c).startsWith('_')&&!['Password Salt','Password Hash'].includes(c));editorTitle.textContent=editing?'Edit Record':'Add Record';editorForm.innerHTML=cols.map(c=>{const v=editing?editing[c]:'';const full=/description|message|details|address/i.test(c);return `<div class="ef ${full?'full':''}"><label>${esc(c)}</label>${full?`<textarea name="${esc(c)}">${esc(v)}</textarea>`:`<input name="${esc(c)}" value="${esc(v)}">`}</div>`}).join('')+'<button class="save" type="submit">'+(editing?'Save Changes':'Add Record')+'</button>';editorModal.classList.add('active')}
function closeEditor(){editorModal.classList.remove('active');editing=null}
async function saveEditor(e){e.preventDefault();const data={};new FormData(editorForm).forEach((v,k)=>data[k]=v);if(!await confirmAction(editing?'Save Changes':'Add Record',editing?'Save these changes to Sursand Connect?':'Add this record to Sursand Connect?'))return false;post({action:'adminSave',section:current,operation:editing?'edit':'add',id:editing?idOf(editing):'',data,token}).then(()=>{closeEditor();refresh()}).catch(handleErr);return false}
function togglePasswordBox(){passBox.classList.toggle('active')}function togglePw(id,b){const e=document.getElementById(id),show=e.type==='password';e.type=show?'text':'password';b.textContent=show?'Hide':'Show'}
async function changeAdminPassword(){if(!adminCurPw.value||!adminNewPw.value||!adminConfirmPw.value){alert('Complete all password fields.');return}if(adminNewPw.value!==adminConfirmPw.value){alert('New passwords do not match.');return}if(adminNewPw.value.length<6){alert('New password must contain at least 6 characters.');return}if(!await confirmAction('Update Admin Password','Change the administrator password now?'))return;post({action:'adminChangePassword',token,currentPassword:adminCurPw.value,newPassword:adminNewPw.value}).then(()=>{adminCurPw.value=adminNewPw.value=adminConfirmPw.value='';passBox.classList.remove('active');alert('Admin password updated successfully.')}).catch(handleErr)}
function logoutAdmin(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(EXP_KEY);location.href='account.html'}
document.addEventListener('DOMContentLoaded',init);
</script>
<script src="../app-i18n.js"></script><script src="../app-i18n-extra.js"></script><script src="../app-account.js"></script>
</body></html>
