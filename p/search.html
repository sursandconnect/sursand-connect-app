<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | Sursand Connect</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Arial;background:#f5f8f6;color:#1f2937}.w{max-width:760px;margin:auto}.back{color:#238b45;font-weight:800;text-decoration:none}.b{display:flex;background:#fff;border:1px solid #e2e8e4;border-radius:18px;padding:6px;position:sticky;top:8px;z-index:5;box-shadow:0 5px 18px rgba(15,23,42,.06)}.b input{flex:1;border:0;outline:0;padding:12px;font-size:14px}.b button{border:0;border-radius:13px;background:#238b45;color:#fff;padding:0 18px;font-weight:800}.m{font-size:12px;color:#64748b;margin:14px 2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.r{display:flex;min-height:92px;flex-direction:column;justify-content:center;background:#fff;border:1px solid #e2e8e4;border-radius:18px;padding:14px;text-decoration:none;color:inherit;box-shadow:0 7px 18px rgba(15,23,42,.06)}.ico{font-size:25px;margin-bottom:7px}.t{font-weight:900;font-size:13px;line-height:1.35}.empty{grid-column:1/-1;padding:30px;text-align:center;color:#64748b}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><a class="back" href="../index.html" id="homeBack">← Home</a><form class="b" id="f"><input id="q" placeholder="Search anything in Sursand Connect"><button id="sb">Search</button></form><div id="m" class="m"></div><div id="o" class="grid"></div></div><script>
const A='https://script.google.com/macros/s/AKfycbzrDLNOj56LEjyLuf4PJiBsH5s36RgRi6y55NjjVJtxvRjFPUMdcXLsOK4ojNUssdNX/exec';
const R={businesses:['businesses.html','🏪'],localServices:['services.html','🛠️'],services:['services.html','🛠️'],events:['events.html','📅'],announcements:['events.html','📢'],notifications:['notifications.html','🔔'],news:['news.html','📰'],representatives:['representatives.html','👥'],schools:['education.html','🎓'],transport:['transport.html','🚌'],places:['important-places.html','📍'],governmentOffices:['government-offices.html','🏛️'],changeMakers:['change-makers.html','🌟'],jobs:['jobs.html','💼'],healthcare:['healthcare.html','🏥'],importantContacts:['important-contacts.html','☎️'],usefulLinks:['useful-websites.html','🌐'],cityConnect:['city-connect.html','💬']};
let D=[];const hi=()=> (localStorage.getItem('scLanguage')||'en')==='hi';const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const flat=x=>{const a=[];(function w(v){if(v==null)return;if(typeof v==='object')Object.values(v).forEach(w);else a.push(String(v))})(x);return a.join(' ').toLowerCase()};
function title(x){return (hi()&&(x['Title Hindi']||x['Business Name Hindi']||x['Service Name Hindi']||x['Service Person Name Hindi']||x['Full Name Hindi']||x['Representative Name Hindi']||x['School Name Hindi']||x['Place Name Hindi']||x['Office Name Hindi']||x['Job Title Hindi']||x['Event Title Hindi']||x['Notification Title Hindi']))||x.Title||x['Business Name']||x['Service Person Name']||x['Service Provider Name']||x['Service Name']||x['Full Name']||x['Representative Name']||x['School Name']||x['Place Name']||x['Office Name']||x['Job Title']||x.Name||x['Event Title']||x['Notification Title']||x['Group Name']||''}
function ui(){homeBack.textContent=hi()?'← होम':'← Home';q.placeholder=hi()?'सुरसंड कनेक्ट में कुछ भी खोजें':'Search anything in Sursand Connect';sb.textContent=hi()?'खोजें':'Search'}
async function load(){ui();m.textContent=hi()?'खोज सूची लोड हो रही है…':'Loading search…';try{const z=await(await fetch(A+'?action=all',{cache:'default'})).json(),d=z.success?z.data:{};D=[];Object.keys(d||{}).forEach(k=>{if(!R[k]||!Array.isArray(d[k]))return;d[k].forEach((v,i)=>{const t=title(v);if(t)D.push({k,v,t,s:flat(v),i})})});run()}catch(e){m.textContent=hi()?'खोज अभी उपलब्ध नहीं है।':'Search is temporarily unavailable.'}}
function run(){const z=q.value.trim().toLowerCase();if(!z){m.textContent=hi()?'खोजने के लिए कुछ लिखें।':'Type something to search.';o.innerHTML='';return}const words=z.split(/\s+/).filter(Boolean);let a=D.filter(v=>words.every(y=>v.s.includes(y)));const seen=new Set();a=a.filter(v=>{const key=v.k+'|'+v.t.toLowerCase();if(seen.has(key))return false;seen.add(key);return true}).slice(0,60);m.textContent=a.length+(hi()?' परिणाम मिले':' results found');o.innerHTML=a.length?a.map(v=>{const r=R[v.k];let href=r[0];const id=v.v.ID||v.v.Id||v.v.id||'';if(id)href+=(href.includes('?')?'&':'?')+'id='+encodeURIComponent(id);return '<a class="r" href="'+href+'"><span class="ico">'+r[1]+'</span><span class="t">'+esc(title(v.v))+'</span></a>'}).join(''):'<div class="empty">'+(hi()?'कोई संबंधित शीर्षक नहीं मिला।':'No related titles found.')+'</div>'}
f.onsubmit=e=>{e.preventDefault();run()};q.value=new URLSearchParams(location.search).get('q')||'';load();window.addEventListener('scLanguageChanged',()=>{ui();run()});</script></body></html>
