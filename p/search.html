<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | Sursand Connect</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Arial;background:#f5f8f6;color:#1f2937}.w{max-width:760px;margin:auto}.back{color:#238b45;font-weight:800;text-decoration:none}.b{display:flex;background:#fff;border:1px solid #e2e8e4;border-radius:18px;padding:6px;position:sticky;top:8px;z-index:5;box-shadow:0 5px 18px rgba(15,23,42,.06)}.b input{flex:1;border:0;outline:0;padding:12px;font-size:14px}.b button{border:0;border-radius:13px;background:#238b45;color:#fff;padding:0 18px;font-weight:800}.m{font-size:12px;color:#64748b;margin:14px 2px}.grid{display:grid;grid-template-columns:1fr;gap:9px}.r{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e2e8e4;border-radius:15px;padding:13px;text-decoration:none;color:inherit;box-shadow:0 5px 16px rgba(15,23,42,.05)}.ico{width:38px;height:38px;border-radius:12px;background:#fff0dd;display:flex;align-items:center;justify-content:center;font-size:20px}.t{font-weight:900;font-size:14px}.k{font-size:10px;color:#64748b;margin-top:3px}.arrow{margin-left:auto;color:#238b45;font-size:20px;font-weight:900}</style></head><body><div class="w"><a class="back" href="../index.html" id="homeBack">← Home</a><form class="b" id="f"><input id="q" placeholder="Search anything in Sursand Connect"><button id="sb">Search</button></form><div id="m" class="m"></div><div id="o" class="grid"></div></div><script>
const A='https://script.google.com/macros/s/AKfycbzrDLNOj56LEjyLuf4PJiBsH5s36RgRi6y55NjjVJtxvRjFPUMdcXLsOK4ojNUssdNX/exec';
const R={businesses:['businesses.html','🏪','Businesses','व्यवसाय'],localServices:['services.html','🛠️','Services','सेवाएं'],services:['services.html','🛠️','Services','सेवाएं'],events:['events.html','📅','Events','कार्यक्रम'],announcements:['events.html','📢','Announcements','घोषणाएं'],notifications:['notifications.html','🔔','Notifications','सूचनाएं'],news:['../index.html#scNewsSection','📰','News & Updates','समाचार व अपडेट'],representatives:['representatives.html','👥','Representatives','प्रतिनिधि'],schools:['education.html','🎓','Education','शिक्षा'],transport:['transport.html','🚌','Transport','परिवहन'],places:['important-places.html','📍','Important Places','महत्वपूर्ण स्थान'],governmentOffices:['government-offices.html','🏛️','Government Offices','सरकारी कार्यालय'],changeMakers:['change-makers.html','🌟','Change Makers','चेंज मेकर्स'],jobs:['jobs.html','💼','Jobs','नौकरियां'],healthcare:['healthcare.html','🏥','Healthcare','स्वास्थ्य सेवा'],importantContacts:['important-contacts.html','☎️','Important Contacts','महत्वपूर्ण संपर्क'],usefulLinks:['useful-websites.html','🌐','Useful Websites','उपयोगी वेबसाइटें'],cityConnect:['city-connect.html','💬','City Connect','सिटी कनेक्ट']};
let D=[];const hi=()=> (localStorage.getItem('scLanguage')||'en')==='hi';const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const flat=x=>{const a=[];(function w(v){if(v==null)return;if(typeof v==='object')Object.values(v).forEach(w);else a.push(String(v))})(x);return a.join(' ')};
function title(x){return (hi()&&(x['Title Hindi']||x['Business Name Hindi']||x['Service Name Hindi']||x['Full Name Hindi']||x['Representative Name Hindi']||x['School Name Hindi']||x['Place Name Hindi']||x['Office Name Hindi']||x['Job Title Hindi']||x['Event Title Hindi']||x['Notification Title Hindi']))||x.Title||x['Business Name']||x['Service Provider Name']||x['Service Name']||x['Full Name']||x['Representative Name']||x['School Name']||x['Place Name']||x['Office Name']||x['Job Title']||x.Name||x['Event Title']||x['Notification Title']||x['Group Name']||''}
function ui(){document.getElementById('homeBack').textContent=hi()?'← होम':'← Home';q.placeholder=hi()?'सुरसंड कनेक्ट में कुछ भी खोजें':'Search anything in Sursand Connect';sb.textContent=hi()?'खोजें':'Search'}
async function load(){ui();m.textContent=hi()?'खोज सूची लोड हो रही है…':'Loading search index…';try{let z=await(await fetch(A+'?action=all',{cache:'default'})).json(),d=z.success?z.data:{};D=[];Object.keys(d||{}).forEach(k=>{if(!R[k]||!Array.isArray(d[k]))return;d[k].forEach(v=>{const t=title(v);if(t)D.push({k,v,t,s:flat(v).toLowerCase()})})});run()}catch(e){m.textContent=hi()?'खोज अभी उपलब्ध नहीं है।':'Search is temporarily unavailable.'}}
function run(){const z=q.value.trim().toLowerCase();if(!z){m.textContent=hi()?'खोजने के लिए कुछ लिखें।':'Type something to search.';o.innerHTML='';return}const words=z.split(/\s+/).filter(Boolean);let a=D.filter(v=>words.every(y=>v.s.includes(y)));const seen=new Set();a=a.filter(v=>{const key=v.k+'|'+v.t.toLowerCase();if(seen.has(key))return false;seen.add(key);return true}).slice(0,100);m.textContent=a.length+(hi()?' परिणाम मिले':' results found');o.innerHTML=a.map(v=>{const r=R[v.k];return '<a class="r" href="'+r[0]+'"><span class="ico">'+r[1]+'</span><span><div class="t">'+esc(title(v.v))+'</div><div class="k">'+esc(hi()?r[3]:r[2])+'</div></span><span class="arrow">›</span></a>'}).join('')}
f.onsubmit=e=>{e.preventDefault();run()};q.value=new URLSearchParams(location.search).get('q')||'';load();window.addEventListener('scLanguageChanged',()=>{ui();run()});
</script></body></html>
