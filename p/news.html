<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>News & Updates | Sursand Connect</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f7;font-family:Arial;color:#263238;padding:16px 14px 40px}.w{max-width:760px;margin:auto}.back{text-decoration:none;color:#238b45;font-weight:900}h1{font-size:22px}.card{background:#fff;border:1px solid #e4e9e6;border-radius:20px;margin:12px 0;overflow:hidden;box-shadow:0 8px 22px rgba(15,23,42,.08)}.title{padding:14px;font-size:16px;font-weight:900}img{width:100%;height:230px;object-fit:cover;display:block}.im{position:relative}.wm{position:absolute;top:8px;right:8px;background:rgba(15,23,42,.72);color:#fff;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900}.body{padding:14px;font-size:12px;line-height:1.65;color:#475569}.empty{padding:30px;text-align:center;color:#667085}</style></head><body><div class="w"><a class="back" href="../index.html">← Home</a><h1>📰 News & Updates</h1><div id="o"></div></div><script src="../app-media.js"></script><script>const API='https://script.google.com/macros/s/AKfycbzrDLNOj56LEjyLuf4PJiBsH5s36RgRi6y55NjjVJtxvRjFPUMdcXLsOK4ojNUssdNX/exec';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hi=()=> (localStorage.getItem('scLanguage')||'en')==='hi';function draw(rows){rows=(rows||[]).filter(x=>String(x.Active||'Yes').toLowerCase()!=='no'&&!/draft|inactive/i.test(String(x.Status||'Active')));o.innerHTML=rows.length?rows.map(n=>{let t=(hi()&&n['Title Hindi'])||n.Title||'Sursand Update',d=(hi()&&n['Description Hindi'])||n.Description||'',im=window.scRecordImage?window.scRecordImage(n):(n['Image URL']||'');return '<article class="card"><div class="title">'+esc(t)+'</div>'+(im?'<div class="im"><img src="'+esc(im)+'"><span class="wm">Sursand Today</span></div>':'')+'<div class="body">'+esc(d).replace(/\n/g,'<br>')+'</div></article>'}).join(''):'<div class="empty">No current news is available.</div>'}fetch(API+'?action=news',{cache:'default'}).then(r=>r.json()).then(j=>draw(j.success?j.data:[])).catch(()=>draw([]));</script></body></html>
