<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News & Updates | Sursand Connect</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f7;font-family:Arial;color:#263238;padding:16px}.w{max-width:760px;margin:auto}.back{color:#238b45;font-weight:900;text-decoration:none}.card{background:#fff;border:1px solid #e4e9e6;border-radius:20px;margin:14px 0;overflow:hidden;box-shadow:0 8px 22px rgba(15,23,42,.08)}.title{padding:15px;font-size:20px;font-weight:900}.im{position:relative}.im img{width:100%;max-height:480px;object-fit:cover;display:block}.wm{position:absolute;right:10px;top:10px;background:rgba(15,23,42,.72);color:#fff;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:900}.body{padding:15px;line-height:1.72;font-size:14px;white-space:normal}.empty{text-align:center;padding:35px;color:#667085}</style></head><body><div class="w"><a class="back" href="../index.html" id="back">← Home</a><h1 id="h">📰 News & Updates</h1><p id="sub">Latest local news from Sursand</p><div id="o"></div></div><script src="../app-media.js"></script><script>const A='https://script.google.com/macros/s/AKfycbzrDLNOj56LEjyLuf4PJiBsH5s36RgRi6y55NjjVtxvRjFPUMdcXLsOK4ojNUssdNX/exec',hi=()=> (localStorage.getItem('scLanguage')||'en')==='hi',esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function ui(){back.textContent=hi()?'← होम':'← Home';h.textContent=hi()?'📰 समाचार व अपडेट':'📰 News & Updates';sub.textContent=hi()?'सुरसंड के नवीनतम स्थानीय समाचार':'Latest local news from Sursand'}async function load(){ui();try{const j=await(await fetch(A+'?action=news&_='+Date.now(),{cache:'no-store'})).json();let rows=j.success&&Array.isArray(j.data)?j.data:[];const id=new URLSearchParams(location.search).get('id');if(id){const x=rows.find((n,i)=>String(n.ID||n.Id||n.id||i)===id);rows=x?[x]:[]}rows=rows.filter(n=>String(n.Active||'Yes').toLowerCase()!=='no'&&!/draft|inactive/i.test(String(n.Status||'Active')));o.innerHTML=rows.length?rows.map(n=>{const t=(hi()&&n['Title Hindi'])||n.Title||'Sursand Update',d=(hi()&&n['Description Hindi'])||n.Description||'',im=window.scRecordImage?window.scRecordImage(n):(n['Image URL']||n.Image||n['Media URL']||'');return '<article class="card"><div class="title">'+esc(t)+'</div>'+(im?'<div class="im"><img src="'+esc(im)+'"><span class="wm">Sursand Today</span></div>':'')+'<div class="body">'+esc(d).split('\n').join('<br>')+'</div></article>'}).join(''):'<div class="empty">'+(hi()?'कोई वर्तमान समाचार उपलब्ध नहीं है।':'No current news is available.')+'</div>'}catch(e){o.innerHTML='<div class="empty">'+(hi()?'समाचार अभी लोड नहीं हो सका।':'News could not be loaded right now.')+'</div>'}}load();window.addEventListener('scLanguageChanged',load);</script></body></html>
