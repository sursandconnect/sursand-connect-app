<script>

/* =========================================================
   API
   ========================================================= */

const SC_ED_API =
"https://script.google.com/macros/s/AKfycbzrDLNOj56LEjyLuf4PJiBsH5s36RgRi6y55NjjVJtxvRjFPUMdcXLsOK4ojNUssdNX/exec";


let scEdData = [];

let scEdCategory =
  "All";


/* =========================================================
   LOAD
   ========================================================= */

async function scEdLoad(){

  try{

    const response =
      await fetch(
        SC_ED_API +
        "?action=schools"
      );


    const result =
      await response.json();


    if(
      !result ||
      !result.success ||
      !Array.isArray(result.data)
    ){

      throw new Error(
        "Education data unavailable"
      );

    }


    scEdData =
      result.data;


    scEdCreateCategories();

    scEdRender();

  }

  catch(error){

    console.error(
      "Schools & Education:",
      error
    );


    document.getElementById(
      "scEdGrid"
    ).innerHTML = `

      <div class="sc-ed-empty">

        Unable to load educational institutions.

      </div>

    `;


    document.getElementById(
      "scEdCount"
    ).textContent =
      "Unable to load data.";

  }

}


/* =========================================================
   CATEGORIES
   ========================================================= */

function scEdCreateCategories(){

  const holder =
    document.getElementById(
      "scEdCategories"
    );


  const categories = [

    "All",

    ...new Set(

      scEdData

        .map(function(item){

          return (

            item["Institution Type"] ||

            item.Category ||

            item.Type ||

            ""

          );

        })

        .filter(Boolean)

    )

  ];


  holder.innerHTML =
    "";


  categories.forEach(
    function(category){

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.textContent =
        category;


      if(
        category === "All"
      ){

        button.classList.add(
          "active"
        );

      }


      button.addEventListener(
        "click",
        function(){

          holder

            .querySelectorAll(
              "button"
            )

            .forEach(
              function(btn){

                btn.classList.remove(
                  "active"
                );

              }
            );


          button.classList.add(
            "active"
          );


          scEdCategory =
            category;


          scEdRender();

        }
      );


      holder.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   RENDER
   ========================================================= */

function scEdRender(){

  const grid =
    document.getElementById(
      "scEdGrid"
    );


  const search =
    document

      .getElementById(
        "scEdSearch"
      )

      .value

      .trim()

      .toLowerCase();


  const filtered =
    scEdData.filter(
      function(item){

        const category =
          String(

            item["Institution Type"] ||

            item.Category ||

            item.Type ||

            ""

          );


        const searchable =
          Object.values(item)

            .join(" ")

            .toLowerCase();


        return (

          (
            scEdCategory ===
              "All"

            ||

            category ===
              scEdCategory
          )

          &&

          (
            !search

            ||

            searchable.includes(
              search
            )
          )

        );

      }
    );


  document.getElementById(
    "scEdCount"
  ).textContent =

    filtered.length +

    (
      filtered.length === 1
        ? " institution found"
        : " institutions found"
    );


  if(
    !filtered.length
  ){

    grid.innerHTML = `

      <div class="sc-ed-empty">

        No educational institution found.

      </div>

    `;

    return;

  }


  grid.innerHTML =
    "";


  filtered.forEach(
    function(item){

      grid.appendChild(
        scEdCreateCard(item)
      );

    }
  );

}


/* =========================================================
   CREATE CARD
   ========================================================= */

function scEdCreateCard(item){

  const name =

    item["Institution Name"] ||

    item["School Name"] ||

    item["College Name"] ||

    item.Name ||

    item.Title ||

    "Educational Institution";


  const type =

    item["Institution Type"] ||

    item.Category ||

    item.Type ||

    "Education";


  const address =

    item.Address ||

    item.Location ||

    "";


  const board =

    item.Board ||

    item.Affiliation ||

    "";


  const classes =

    item.Classes ||

    item["Class Range"] ||

    item["Classes Offered"] ||

    "";


  const description =

    item.Description ||

    item.Details ||

    item.About ||

    "";


  const phone =

    item.Phone ||

    item["Contact Number"] ||

    item.Mobile ||

    "";


  const whatsapp =

    item.WhatsApp ||

    item["WhatsApp Number"] ||

    item["Whatsapp Number"] ||

    "";


  const image =

    item["Image URL"] ||

    item.Image ||

    item["Photo URL"] ||

    item.Photo ||

    "";


  const map =

    item["Google Map Link"] ||

    item["Google Maps Link"] ||

    item["Map URL"] ||

    item.Map ||

    item.GoogleMaps ||

    "";


  /* =====================================================
     ALWAYS AVAILABLE DIRECTIONS
     ===================================================== */

  let directionsUrl =
    "";


  if(
    scEdValidUrl(map)
  ){

    directionsUrl =
      String(map).trim();

  }

  else{

    const mapSearch =

      name +

      (
        address
          ? ", " + address
          : ", Sursand, Bihar"
      );


    directionsUrl =

      "https://www.google.com/maps/search/?api=1&query=" +

      encodeURIComponent(
        mapSearch
      );

  }


  /* =====================================================
     CARD
     ===================================================== */

  const card =
    document.createElement(
      "article"
    );


  card.className =
    "sc-ed-card";


  /* OPTIONAL IMAGE */

  if(
    scEdValidUrl(image)
  ){

    const imageWrap =
      document.createElement(
        "div"
      );


    imageWrap.className =
      "sc-ed-image-wrap";


    const img =
      document.createElement(
        "img"
      );


    img.className =
      "sc-ed-image";


    img.src =
      image;


    img.alt =
      name;


    img.loading =
      "lazy";


    img.onerror =
      function(){

        imageWrap.remove();

      };


    imageWrap.appendChild(
      img
    );


    card.appendChild(
      imageWrap
    );

  }


  /* BODY */

  const body =
    document.createElement(
      "div"
    );


  body.className =
    "sc-ed-body";


  /* ICON */

  const icon =
    document.createElement(
      "div"
    );


  icon.className =
    "sc-ed-icon";


  icon.textContent =
    scEdIcon(type);


  body.appendChild(
    icon
  );


  /* TYPE */

  const typeElement =
    document.createElement(
      "span"
    );


  typeElement.className =
    "sc-ed-type";


  typeElement.textContent =
    type;


  body.appendChild(
    typeElement
  );


  /* TITLE */

  const title =
    document.createElement(
      "h3"
    );


  title.textContent =
    name;


  body.appendChild(
    title
  );


  /* SHORT INFO */

  const info =
    document.createElement(
      "div"
    );


  info.className =
    "sc-ed-short-info";


  let infoHtml =
    "";


  if(board){

    infoHtml +=

      "📚 <strong>Board:</strong> " +

      scEdEsc(board) +

      "<br>";

  }


  if(classes){

    infoHtml +=

      "🏫 <strong>Classes:</strong> " +

      scEdEsc(classes);

  }


  if(
    !board &&
    !classes &&
    address
  ){

    infoHtml =

      "📍 " +

      scEdEsc(address);

  }


  info.innerHTML =
    infoHtml;


  body.appendChild(
    info
  );


  /* =====================================================
     ACTIONS
     ===================================================== */

  const actions =
    document.createElement(
      "div"
    );


  actions.className =
    "sc-ed-actions";


  /* KNOW MORE */

  const more =
    document.createElement(
      "button"
    );


  more.type =
    "button";


  more.className =
    "sc-ed-more";


  more.innerHTML =
    "ⓘ Know More";


  more.addEventListener(
    "click",
    function(){

      scEdOpenModal({

        name:name,

        type:type,

        address:address,

        board:board,

        classes:classes,

        description:description,

        phone:phone,

        whatsapp:whatsapp,

        image:image,

        directionsUrl:
          directionsUrl

      });

    }
  );


  actions.appendChild(
    more
  );


  /* CALL */

  if(phone){

    const call =
      document.createElement(
        "a"
      );


    call.className =
      "sc-ed-call";


    call.href =
      "tel:" +
      scEdPhone(phone);


    call.innerHTML =
      "📞 Call";


    actions.appendChild(
      call
    );

  }


  /* WHATSAPP */

  if(whatsapp){

    const cleanWhatsapp =
      scEdWhatsApp(
        whatsapp
      );


    if(cleanWhatsapp){

      const wa =
        document.createElement(
          "a"
        );


      wa.className =
        "sc-ed-whatsapp";


      wa.href =
        "https://wa.me/" +
        cleanWhatsapp;


      wa.target =
        "_blank";


      wa.rel =
        "noopener";


      wa.innerHTML =
        "💬 WhatsApp";


      actions.appendChild(
        wa
      );

    }

  }


  /* DIRECTIONS */

  const direction =
    document.createElement(
      "a"
    );


  direction.className =
    "sc-ed-direction";


  direction.href =
    directionsUrl;


  direction.target =
    "_blank";


  direction.rel =
    "noopener noreferrer";


  direction.innerHTML =
    "🧭 Get Directions";


  actions.appendChild(
    direction
  );


  body.appendChild(
    actions
  );


  card.appendChild(
    body
  );


  return card;

}


/* =========================================================
   OPEN DETAILS
   ========================================================= */

function scEdOpenModal(data){

  document.getElementById(
    "scEdModalType"
  ).textContent =

    scEdIcon(data.type) +

    " " +

    data.type;


  document.getElementById(
    "scEdModalTitle"
  ).textContent =
    data.name;


  /* IMAGE */

  const image =
    document.getElementById(
      "scEdModalImage"
    );


  if(
    scEdValidUrl(
      data.image
    )
  ){

    image.src =
      data.image;


    image.alt =
      data.name;


    image.style.display =
      "block";

  }

  else{

    image.removeAttribute(
      "src"
    );


    image.style.display =
      "none";

  }


  /* DETAILS */

  const details =
    document.getElementById(
      "scEdModalDetails"
    );


  let detailsHtml =
    "";


  if(data.address){

    detailsHtml += `

      <div class="sc-ed-detail">

        <span>
          Address
        </span>

        <strong>
          📍 ${scEdEsc(data.address)}
        </strong>

      </div>

    `;

  }


  if(data.board){

    detailsHtml += `

      <div class="sc-ed-detail">

        <span>
          Board / Affiliation
        </span>

        <strong>
          📚 ${scEdEsc(data.board)}
        </strong>

      </div>

    `;

  }


  if(data.classes){

    detailsHtml += `

      <div class="sc-ed-detail">

        <span>
          Classes
        </span>

        <strong>
          🏫 ${scEdEsc(data.classes)}
        </strong>

      </div>

    `;

  }


  if(data.phone){

    detailsHtml += `

      <div class="sc-ed-detail">

        <span>
          Contact
        </span>

        <strong>
          📞 ${scEdEsc(data.phone)}
        </strong>

      </div>

    `;

  }


  details.innerHTML =
    detailsHtml;


  /* DESCRIPTION */

  document.getElementById(
    "scEdModalDescription"
  ).textContent =

    data.description ||

    "Additional information about this institution will be added soon.";


  /* ACTIONS */

  const actions =
    document.getElementById(
      "scEdModalActions"
    );


  actions.innerHTML =
    "";


  if(data.phone){

    const call =
      document.createElement(
        "a"
      );


    call.className =
      "sc-ed-call";


    call.href =
      "tel:" +
      scEdPhone(data.phone);


    call.innerHTML =
      "📞 Call";


    actions.appendChild(
      call
    );

  }


  if(data.whatsapp){

    const number =
      scEdWhatsApp(
        data.whatsapp
      );


    if(number){

      const wa =
        document.createElement(
          "a"
        );


      wa.className =
        "sc-ed-whatsapp";


      wa.href =
        "https://wa.me/" +
        number;


      wa.target =
        "_blank";


      wa.rel =
        "noopener";


      wa.innerHTML =
        "💬 WhatsApp";


      actions.appendChild(
        wa
      );

    }

  }


  const direction =
    document.createElement(
      "a"
    );


  direction.className =
    "sc-ed-direction";


  direction.href =
    data.directionsUrl;


  direction.target =
    "_blank";


  direction.rel =
    "noopener noreferrer";


  direction.innerHTML =
    "🧭 Directions";


  actions.appendChild(
    direction
  );


  /* OPEN */

  document
    .getElementById(
      "scEdModal"
    )
    .classList.add(
      "active"
    );


  document.body.style.overflow =
    "hidden";

}


/* =========================================================
   CLOSE
   ========================================================= */

function scEdCloseModal(){

  document
    .getElementById(
      "scEdModal"
    )
    .classList.remove(
      "active"
    );


  document.body.style.overflow =
    "";

}


/* CLICK OUTSIDE */

document
  .getElementById(
    "scEdModal"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        scEdCloseModal();

      }

    }
  );


/* ESC */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      scEdCloseModal();

    }

  }
);


/* =========================================================
   ICONS
   ========================================================= */

function scEdIcon(type){

  const value =
    String(
      type || ""
    )
    .toLowerCase();


  if(
    value.includes(
      "college"
    )
  ){
    return "🎓";
  }


  if(
    value.includes(
      "coaching"
    )
  ){
    return "📖";
  }


  if(
    value.includes(
      "university"
    )
  ){
    return "🏛️";
  }


  if(
    value.includes(
      "computer"
    )
  ){
    return "💻";
  }


  if(
    value.includes(
      "training"
    )
  ){
    return "🧑‍🏫";
  }


  return "🏫";

}


/* =========================================================
   PHONE
   ========================================================= */

function scEdPhone(value){

  return String(
    value || ""
  )
  .replace(
    /[^0-9+]/g,
    ""
  );

}


/* =========================================================
   WHATSAPP
   ========================================================= */

function scEdWhatsApp(value){

  let number =
    String(
      value || ""
    )
    .replace(
      /\D/g,
      ""
    );


  if(
    number.length === 10
  ){

    number =
      "91" +
      number;

  }


  return number;

}


/* =========================================================
   URL CHECK
   ========================================================= */

function scEdValidUrl(value){

  const url =
    String(
      value || ""
    )
    .trim();


  return (

    url.startsWith(
      "https://"
    )

    ||

    url.startsWith(
      "http://"
    )

  );

}


/* =========================================================
   ESCAPE
   ========================================================= */

function scEdEsc(value){

  return String(
    value == null
      ? ""
      : value
  )

  .replace(/&/g,"&amp;")

  .replace(/</g,"&lt;")

  .replace(/>/g,"&gt;")

  .replace(/"/g,"&quot;")

  .replace(/'/g,"&#039;");

}


/* =========================================================
   START
   ========================================================= */

if(
  document.readyState ===
    "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    scEdLoad
  );

}

else{

  scEdLoad();

}
